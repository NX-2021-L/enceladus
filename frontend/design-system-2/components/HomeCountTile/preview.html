<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--font-body)}body{padding:20px;box-sizing:border-box}*{box-sizing:border-box}.lbl{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);margin:0 0 8px}.g{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.s{padding:12px 14px;border-radius:8px;margin-bottom:8px}.s0{background:var(--canvas);border:1px solid var(--divider)}.s1{background:var(--surface);border:1px solid var(--border)}.s2{background:var(--surface-raised)}.note{font-size:12px;color:var(--text-dim);line-height:1.55;margin:6px 0 0}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}.tile b{display:block;font-family:var(--font-mono);font-size:1.5rem;font-weight:500;color:var(--text-display);font-variant-numeric:tabular-nums}.tile span{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim)}.tile.q{box-shadow:inset 3px 0 0 var(--status-waiting-rail)}.tile.q b{color:var(--warning-text)}</style></head><body><div class="tiles"><div class="tile q"><b>3</b><span>Requires io</span></div><div class="tile"><b>41</b><span>Open tasks</span></div><div class="tile"><b>12</b><span>Open issues</span></div><div class="tile"><b>77</b><span>Lessons</span></div></div><p class="note">Schematic, with illustrative counts. The catalog names the count tiles and the "Requires io" queue but gives no measurements. The queue tile uses the waiting role, the same amber as a waiting pill.</p></body></html>
