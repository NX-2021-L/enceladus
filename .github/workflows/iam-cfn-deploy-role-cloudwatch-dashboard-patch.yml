name: IAM CFN Deploy Role — CloudWatch Dashboard Patch

# ENC-TSK-P99 / ENC-ISS-775: this workflow and its prod sibling
# (iam-cfn-deploy-role-cloudwatch-dashboard-prod-patch.yml) both used to
# `put-role-policy` under DIFFERENT policy names onto the same role. That
# grew the role's inline-policy count and pushed it over the IAM aggregate
# inline-policy cap (10,240 characters, whitespace excluded), which is what
# made the prod sibling's run 35169979296 fail with LimitExceeded. Both
# workflows now write the SAME merged document (one statement covering both
# the gamma and prod dashboard ARNs) under the SAME existing policy name
# (enceladus-cfn-deploy-gamma-cloudwatch-dashboard-v1), and both check
# tools/iam_inline_policy_budget.py before the put so a run fails closed
# instead of hitting LimitExceeded live. ENC-TSK-Q03: run 35172068267 of the
# prod sibling failed because the assumed OIDC role can put/get-role-policy
# on this one role but not list-role-policies, so the budget script's own
# aggregate listing was denied and it never even printed why. Both budget
# invocations below now pass --on-list-denied warn: if the listing is
# denied the script degrades to measuring only the merge target policy via
# get-role-policy (still gated) instead of failing the job — the atomic
# put-role-policy call below is IAM's own LimitExceeded-guarded write, so a
# denied aggregate LIST must not block it.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this patch is needed"
        type: string
        required: false
        default: "Grant cloudwatch:PutDashboard (+ Get/Delete/List) on the gamma v4 architecture dashboard to the CFN deploy role (ENC-TSK-K46 / ENC-TSK-K59, enceladus-monitoring-gamma UPDATE_ROLLBACK_COMPLETE due to missing permission)"

permissions:
  contents: read
  id-token: write

jobs:
  patch-role:
    name: Patch CFN deploy role with gamma CloudWatch Dashboard permissions
    # ENC-TSK-K59 / ENC-FTR-120: live IAM mutation (shared/global role object) — pauses on the v3-prod required-reviewer rule.
    environment: v3-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKEND_ROLE_TO_ASSUME }}
          aws-region: us-west-2

      - name: Verify caller identity
        run: aws sts get-caller-identity

      - name: Write merged CloudWatch Dashboard policy document
        run: |
          set -euo pipefail
          cat > /tmp/merged-cloudwatch-dashboard-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "CloudWatchDashboardOps",
                "Effect": "Allow",
                "Action": [
                  "cloudwatch:PutDashboard",
                  "cloudwatch:GetDashboard",
                  "cloudwatch:DeleteDashboards",
                  "cloudwatch:ListDashboards"
                ],
                "Resource": [
                  "arn:aws:cloudwatch::356364570033:dashboard/enceladus-v4-architecture-gamma",
                  "arn:aws:cloudwatch::356364570033:dashboard/enceladus-v4-architecture"
                ]
              }
            ]
          }
          JSON

      - name: Check inline-policy budget (fails before any write if it does not fit)
        run: |
          python3 tools/iam_inline_policy_budget.py \
            --role "enceladus-cloudformation-deploy-github-role" \
            --merge-policy "enceladus-cfn-deploy-gamma-cloudwatch-dashboard-v1" \
            --merge-document "/tmp/merged-cloudwatch-dashboard-policy.json" \
            --on-list-denied warn

      - name: Apply merged inline policy — CloudWatch Dashboard (gamma + prod)
        run: |
          set -euo pipefail
          aws iam put-role-policy \
            --role-name "enceladus-cloudformation-deploy-github-role" \
            --policy-name "enceladus-cfn-deploy-gamma-cloudwatch-dashboard-v1" \
            --policy-document "file:///tmp/merged-cloudwatch-dashboard-policy.json"

      - name: Verify inline policy attached
        run: |
          aws iam get-role-policy \
            --role-name "enceladus-cloudformation-deploy-github-role" \
            --policy-name "enceladus-cfn-deploy-gamma-cloudwatch-dashboard-v1" \
            --query '{RoleName:RoleName,PolicyName:PolicyName}' \
            --output table

      - name: Post-write inline-policy budget (visibility for the next patch)
        run: |
          python3 tools/iam_inline_policy_budget.py \
            --role "enceladus-cloudformation-deploy-github-role" \
            --on-list-denied warn
