name: MCP Sign-in Client Guard

# ENC-TSK-S57 / MCP fleet F-12: a pull request cannot weaken the Cognito sign-in client
# (13-mcp-signin-client.yaml). Static only: no AWS credentials, no network beyond pip.

on:
  push:
    branches:
      - main
      - 'v[0-9]*/main'
    paths:
      - "infrastructure/cloudformation/13-mcp-signin-client.yaml"
      - "tools/check_mcp_signin_client.py"
      - "tools/test_check_mcp_signin_client.py"
      - ".github/workflows/mcp-signin-client-guard.yml"
  pull_request:
    branches:
      - main
      - 'v[0-9]*/main'
    paths:
      - "infrastructure/cloudformation/13-mcp-signin-client.yaml"
      - "tools/check_mcp_signin_client.py"
      - "tools/test_check_mcp_signin_client.py"
      - ".github/workflows/mcp-signin-client-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Self-test the guard (must fail on each weakening)
        run: python3 tools/test_check_mcp_signin_client.py

      - name: Enforce sign-in client profile
        run: python3 tools/check_mcp_signin_client.py
