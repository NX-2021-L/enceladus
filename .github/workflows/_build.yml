name: Build Lambda Artifacts (Gen2)

# ENC-FTR-090 / ENC-PLN-041 Phase 1 / ENC-TSK-F59
#
# Reusable workflow. Produces arch-tagged, SHA-pinned, S3-versioned Lambda zip
# artifacts via a strategy matrix. Native runners per architecture (zero QEMU).
#
# Each matrix row produces one zip per Lambda and uploads to:
#   s3://<artifact_bucket>/lambda-artifacts/<arch>-py<ver>/<function>-<sha>.zip
# Versioning is required on the bucket (S3 Versioning=Enabled). The returned
# VersionId is the canonical promotable identity \u2014 captured in the output
# manifest JSON and consumed by envs/<target>.yaml in F60 Phase 2.
#
# Invariants enforced:
#   - ubuntu-24.04-arm host <=> arm64 <=> python3.12 (matches
#     tools/cfn-guard/lambda-architecture.guard + runtime-whitelist.guard
#     + manifest-shape.guard matrix rules). ENC-TSK-Q20 FR-5 collapsed the
#     legacy two-row matrix down to this single declared row, derived from
#     envs/architecture.yaml (tools/arch_declaration.py).
#   - pip install uses --platform + --only-binary=:all: to prevent source
#     builds that would fall back to the host arch (ENC-ISS-213 aarch64-abi3
#     protection). --implementation cp + --python-version pins the ABI.
#   - ENC-TSK-Q20 FR-6: artifact keys are immutable. Before packaging, a
#     function's key is head-object probed; an existing object is never
#     rebuilt or byte-compared (zips are not byte-reproducible across
#     builds) -- it is skipped, cross-checking its stored checksum against
#     the sha256 this workflow records as upload-time object metadata. A
#     new upload writes with --if-none-match '*' so a concurrent writer
#     racing the same key fails loudly (412) instead of silently clobbering.
#
# Downstream: F60 Phase 2 _deploy.yml consumes artifact_manifest.json (GitHub
# Actions workflow artifact) to resolve which S3 VersionId to deploy per
# function per environment.

on:
  workflow_call:
    inputs:
      commit_sha:
        description: "40-char hex commit SHA to build from. Used in S3 object key."
        type: string
        required: true
      lambdas_to_build:
        description: "Comma-separated list of Lambda directory names under backend/lambda/. Empty = all."
        type: string
        required: false
        default: ""
      artifact_bucket:
        description: "S3 bucket for versioned artifacts. Must have versioning enabled."
        type: string
        required: false
        default: "jreese-net"
      artifact_key_prefix:
        description: "S3 key prefix under the artifact bucket."
        type: string
        required: false
        default: "lambda-artifacts"
    outputs:
      artifact_manifest_path:
        description: "Workflow-artifact name containing the JSON manifest of {function: s3_version_id} per arch."
        value: ${{ jobs.build.outputs.manifest_path }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: build-${{ matrix.arch }}-py${{ matrix.py_version }}
    strategy:
      fail-fast: false
      matrix:
        # ENC-TSK-Q20 FR-5: single row, derived from envs/architecture.yaml
        # (tools/arch_declaration.py --field arch|runtime) -- arm64/3.12 is
        # the ONE declared build target on every plane. Kept as a
        # `matrix.include` list (not flattened) so the job name stays
        # build-arm64-py3.12 and downstream `needs.build.outputs.*`
        # references are unchanged.
        include:
          - arch: arm64
            py_version: "3.12"
            runner: ubuntu-24.04-arm
            pip_platform: manylinux2014_aarch64
    runs-on: ${{ matrix.runner }}
    outputs:
      manifest_path: gen2-artifact-manifest-${{ matrix.arch }}
    steps:
      - name: Checkout repo at requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Set up Python ${{ matrix.py_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py_version }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356364570033:role/GitHubActions-Build-Role
          aws-region: us-west-2

      - name: Enumerate Lambdas to build
        id: enumerate
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ inputs.lambdas_to_build }}" ]; then
            # Discover every backend/lambda/<name>/ that contains a lambda_function.py.
            mapfile -t fns < <(find backend/lambda -maxdepth 2 -name lambda_function.py \
              | sed -E 's|backend/lambda/([^/]+)/lambda_function.py|\1|' | sort -u)
          else
            IFS=',' read -ra fns <<< "${{ inputs.lambdas_to_build }}"
          fi
          printf '%s\n' "${fns[@]}" > /tmp/functions.txt
          echo "count=${#fns[@]}" >> "$GITHUB_OUTPUT"
          echo "Functions to build: ${fns[*]}"

      - name: Build + upload artifacts
        id: build_upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/build-out
          bucket="${{ inputs.artifact_bucket }}"
          sha="${{ inputs.commit_sha }}"
          version_ids_file="/tmp/version-ids-${{ matrix.arch }}.txt"
          : > "$version_ids_file"

          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            srcdir="backend/lambda/$fn"
            [ -d "$srcdir" ] || { echo "skip missing $srcdir"; continue; }

            key="${{ inputs.artifact_key_prefix }}/${{ matrix.arch }}-py${{ matrix.py_version }}/${fn}-${sha}.zip"

            # ENC-TSK-Q20 FR-6: artifact keys are immutable -- a zip is NOT
            # byte-reproducible across rebuilds (timestamps, filesystem
            # ordering), so an existing object at this key is never rebuilt
            # or byte-compared. head-object BEFORE packaging: if the key
            # already exists, skip packaging entirely and just record its
            # VersionId for the manifest.
            head_json="/tmp/head-$fn.json"
            rm -f "$head_json"
            if aws s3api head-object --bucket "$bucket" --key "$key" \
                --checksum-mode ENABLED --output json \
                > "$head_json" 2>"/tmp/head-err-$fn.txt"; then
              info=$(python3 -c "import json; d = json.load(open('$head_json')); cs = d.get('ChecksumSHA256') or ''; meta = (d.get('Metadata') or {}).get('sha256') or ''; vid = d.get('VersionId') or ''; print(cs, meta, vid, sep='\t')")
              IFS=$'\t' read -r stored_checksum_b64 stored_sha256_meta version_id <<< "$info"

              stored_checksum_hex=""
              if [ -n "$stored_checksum_b64" ]; then
                stored_checksum_hex=$(python3 -c "import base64,sys; print(base64.b64decode(sys.argv[1]).hex())" "$stored_checksum_b64")
              fi

              if [ -n "$stored_checksum_hex" ] && [ -n "$stored_sha256_meta" ]; then
                if [ "$stored_checksum_hex" = "$stored_sha256_meta" ]; then
                  echo "skip-on-exists key=$key sha256=$stored_sha256_meta version=$version_id (stored checksum == recorded upload hash)"
                else
                  echo "::error::skip-on-exists hash mismatch key=$key stored_checksum_sha256=$stored_checksum_hex recorded_metadata_sha256=$stored_sha256_meta"
                  exit 1
                fi
              else
                echo "skip-on-exists key=$key version=$version_id (pre-FR-6 object, no recorded hash)"
              fi

              printf '%s=%s\n' "$fn" "$version_id" >> "$version_ids_file"
              continue
            fi

            workdir="/tmp/build-$fn"
            rm -rf "$workdir"
            mkdir -p "$workdir"

            # Copy source.
            rsync -a --exclude='__pycache__' --exclude='*.pyc' "$srcdir/" "$workdir/"

            # ENC-TSK-K11/K12: coordination_api, mcp_code, and mcp_streamable load
            # server.py from the function zip root (ENCELADUS_MCP_SERVER_PATH=server.py).
            # Package the full MCP server runtime module set — telemetry_rank and siblings
            # are required (mcp.jreese.net Function URL -> enceladus-mcp-streamable*).
            # ENC-TSK-L10: mcp_streaming_gateway also imports `from server import app`
            # (see asgi_app.py) for the REST API Gateway response-streaming endpoint.
            if [ "$fn" = "mcp_code" ] || [ "$fn" = "coordination_api" ] || [ "$fn" = "mcp_streamable" ] || [ "$fn" = "mcp_streaming_gateway" ]; then
              for py in tools/enceladus-mcp-server/*.py; do
                base=$(basename "$py")
                case "$base" in
                  test_*) continue ;;
                esac
                cp "$py" "$workdir/$base"
              done
              # ENC-TSK-L63 / ENC-ISS-492: server.py imports the decomposed mcp_server
              # package (ENC-TSK-L09). Root-level *.py copy alone is insufficient.
              if [ ! -d tools/enceladus-mcp-server/mcp_server ]; then
                echo "ERROR: $fn requires tools/enceladus-mcp-server/mcp_server package" >&2
                exit 1
              fi
              rsync -a --exclude='__pycache__' --exclude='*.pyc' \
                tools/enceladus-mcp-server/mcp_server/ "$workdir/mcp_server/"
              echo "  [$fn] packaged tools/enceladus-mcp-server runtime modules + mcp_server/"
            fi

            # ENC-TSK-G43: cross-Lambda module sharing via .build_extras manifest.
            # Each non-comment line is a path (relative to repo root) to a single
            # file that gets copied to the function root. Used by Lambdas that
            # import a pure-helper module owned by another Lambda dir
            # (e.g. graph_sync/mentions_extraction.py -> deploy_parity_validator).
            # The manifest itself is stripped from the build artifact.
            if [ -f "$workdir/.build_extras" ]; then
              while IFS= read -r extra; do
                [ -z "$extra" ] && continue
                case "$extra" in \#*) continue ;; esac
                if [ ! -f "$extra" ]; then
                  echo "ERROR: $fn .build_extras references missing file: $extra" >&2
                  exit 1
                fi
                cp "$extra" "$workdir/$(basename "$extra")"
                echo "  [extras] $fn <- $extra"
              done < "$workdir/.build_extras"
              rm -f "$workdir/.build_extras"
            fi

            # Install deps to the same dir \u2014 arch-locked wheels only.
            if [ -f "$workdir/requirements.txt" ]; then
              python -m pip install \
                --platform "${{ matrix.pip_platform }}" \
                --implementation cp \
                --python-version "${{ matrix.py_version }}" \
                --only-binary=:all: \
                --upgrade \
                --target "$workdir" \
                -r "$workdir/requirements.txt"
            fi

            # Zip at function root (matches Lambda handler expectations).
            zipfile="/tmp/build-out/$fn.zip"
            (cd "$workdir" && zip -qrX "$zipfile" .)

            # ENC-TSK-Q19 FR-4: inspect the actual zip contents for a wrong-ABI
            # .so before it ever reaches S3 -- a Gen2 package-arch gate, not
            # just a pre-build pip-flag check (stdlib-only; no extra install).
            python3 tools/verify_lambda_package_arch.py \
              --package "$zipfile" --expected-arch "${{ matrix.arch }}"

            # ENC-TSK-Q20 FR-6: S3 upload (bucket must have Versioning=Enabled).
            # sha256 the zip and record it as recoverable object metadata
            # (checked by the head-object skip-on-exists path above), and
            # write with a conditional PUT so two racing builds for the same
            # key can't silently clobber one another -- a 412 fails loudly.
            sha256_hex=$(sha256sum "$zipfile" | awk '{print $1}')
            put_err="/tmp/put-err-$fn.txt"
            if put_out=$(aws s3api put-object \
                --bucket "$bucket" \
                --key "$key" \
                --body "$zipfile" \
                --content-type application/zip \
                --checksum-algorithm SHA256 \
                --metadata sha256="$sha256_hex" \
                --if-none-match '*' \
                --output json 2>"$put_err"); then
              version_id=$(echo "$put_out" | python3 -c 'import sys,json; print(json.load(sys.stdin)["VersionId"])')
              printf '%s=%s\n' "$fn" "$version_id" >> "$version_ids_file"
              echo "uploaded s3://$bucket/$key VersionId=$version_id sha256=$sha256_hex"
            else
              put_rc=$?
              err_text=$(cat "$put_err")
              if echo "$err_text" | grep -qi 'PreconditionFailed\|412'; then
                echo "::error::concurrent writer won for key=$key (If-None-Match precondition failed, exit $put_rc): $err_text"
              else
                echo "::error::failed to upload key=$key (exit $put_rc): $err_text"
              fi
              exit 1
            fi
          done < /tmp/functions.txt

          # Emit manifest JSON: {arch, py_version, commit_sha, artifact_version_ids: {fn: version_id}}.
          # ids are read back from version_ids_file (both the skip-on-exists
          # and freshly-uploaded paths append to it) so the manifest keeps
          # its {fn: version_id} shape regardless of which path each
          # function took.
          python - "$version_ids_file" <<PY > /tmp/manifest-${{ matrix.arch }}.json
          import json, sys
          ids = {}
          with open(sys.argv[1]) as fh:
              for line in fh:
                  line = line.strip()
                  if not line or "=" not in line:
                      continue
                  fn, vid = line.split("=", 1)
                  ids[fn] = vid
          manifest = {
              "arch": "${{ matrix.arch }}",
              "py_version": "${{ matrix.py_version }}",
              "commit_sha": "${{ inputs.commit_sha }}",
              "artifact_bucket": "${{ inputs.artifact_bucket }}",
              "artifact_key_prefix": "${{ inputs.artifact_key_prefix }}",
              "artifact_version_ids": ids,
          }
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen2-artifact-manifest-${{ matrix.arch }}
          path: /tmp/manifest-${{ matrix.arch }}.json
          retention-days: 30
          if-no-files-found: error
