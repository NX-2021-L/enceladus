name: CloudFormation API Stack Deploy

# ENC-TSK-J62 / ENC-FTR-120: plan/apply split with a GitHub Environment gate.
# The plan job creates (but does not execute) the change-set and writes its
# resource-level summary to the job summary. The apply job runs inside a
# GitHub Environment — v3-prod (required reviewer: io) for main, v4-gamma
# (no reviewer) for v4/** — so a merge to main PAUSES as a reviewable,
# rejectable request instead of deploying prod directly (the 1292/J08 class).
# Change-set creation uses `aws cloudformation deploy --no-execute-changeset`
# deliberately: it preserves deploy's parameter-override semantics (unlisted
# params reuse the stack's stored values), which the ENC-LSN-053 NoEcho
# strip-class guards depend on.

on:
  push:
    branches:
      - main
      - 'v4/**'
    paths:
      - "infrastructure/cloudformation/03-api.yaml"
      - "infrastructure/cloudformation/resource-import-api.json"
      - ".github/workflows/cloudformation-api-stack-deploy.yml"
  workflow_dispatch:
    inputs:
      stack_name:
        description: "CloudFormation stack name for 03-api template"
        type: string
        required: false
        default: "enceladus-api"
      compute_stack_name:
        description: "Referenced compute stack name"
        type: string
        required: false
        default: "enceladus-compute"
      api_name:
        description: "API Gateway name parameter"
        type: string
        required: false
        default: "devops-tracker-api"
      reason:
        description: "Why this deploy is being triggered"
        type: string
        required: false
        default: "manual API stack deploy"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudformation-api-stack-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TEMPLATE_FILE: infrastructure/cloudformation/03-api.yaml
  ENVIRONMENT_SUFFIX: ${{ startsWith(github.ref, 'refs/heads/v4/') && '-gamma' || '' }}
  DEFAULT_STACK_NAME: enceladus-api
  DEFAULT_COMPUTE_STACK_NAME: enceladus-compute
  DEFAULT_API_NAME: devops-tracker-api

jobs:
  plan:
    name: Plan API stack change-set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stack_name: ${{ steps.params.outputs.stack_name }}
      has_changes: ${{ steps.changeset.outputs.has_changes }}
      changeset_arn: ${{ steps.changeset.outputs.changeset_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CF role secret is set
        run: |
          if [ -z "${{ secrets.AWS_CLOUDFORMATION_ROLE_TO_ASSUME }}" ]; then
            echo "::error::AWS_CLOUDFORMATION_ROLE_TO_ASSUME secret is not set or empty. Set it to the ARN of a role with cloudformation:* and apigateway:* permissions."
            exit 1
          fi
          echo "AWS_CLOUDFORMATION_ROLE_TO_ASSUME is set."

      - name: Configure AWS credentials (OIDC privileged CloudFormation role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLOUDFORMATION_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve deployment parameters
        id: params
        env:
          INPUT_STACK_NAME: ${{ github.event.inputs.stack_name }}
          INPUT_COMPUTE_STACK_NAME: ${{ github.event.inputs.compute_stack_name }}
          INPUT_API_NAME: ${{ github.event.inputs.api_name }}
        run: |
          set -euo pipefail

          stack_name="${INPUT_STACK_NAME:-${DEFAULT_STACK_NAME}}${ENVIRONMENT_SUFFIX}"
          compute_stack_name="${INPUT_COMPUTE_STACK_NAME:-${DEFAULT_COMPUTE_STACK_NAME}}${ENVIRONMENT_SUFFIX}"
          api_name="${INPUT_API_NAME:-${DEFAULT_API_NAME}}${ENVIRONMENT_SUFFIX}"

          {
            echo "stack_name=${stack_name}"
            echo "compute_stack_name=${compute_stack_name}"
            echo "api_name=${api_name}"
          } >> "${GITHUB_OUTPUT}"

      # ENC-TSK-P01 / ENC-ISS-657 — CROSS-STACK ORDERING GATE.
      #
      # 03-api.yaml's EscalationDecisionAuthorizerInvokePermission references a
      # Lambda created by the COMPUTE stack (escalation-decision-authorizer*) by
      # a plain !Sub string, not an imported Export -- so CloudFormation has no
      # way to know this stack must wait. Both stacks deploy on independent
      # workflows off the same push. On 2026-08-23 the API stack won the race
      # (run 32615617807 vs 32615617794), the permission CREATE_FAILED on
      # "Function not found", and the rollback could not delete the authorizer
      # it had just created because the routes already referenced it -- leaving
      # an orphaned live Authorizer outside CloudFormation management and every
      # subsequent deploy failing on "Authorizer name must be unique".
      #
      # Two assertions, cheapest first. Waiting on the compute stack is not
      # sufficient on its own: the stack can be UPDATE_COMPLETE from an earlier
      # run that predates the function. So the function's existence is asserted
      # directly -- that is the actual precondition.
      - name: Wait for the compute stack, then assert the authorizer Lambda exists (ENC-ISS-657)
        run: |
          set -euo pipefail
          compute_stack="${{ steps.params.outputs.compute_stack_name }}"
          authorizer_fn="escalation-decision-authorizer${ENVIRONMENT_SUFFIX}"

          echo "Waiting for ${compute_stack} to leave any in-progress state..."
          deadline=$(( SECONDS + 1800 ))
          while : ; do
            status=$(aws cloudformation describe-stacks \
              --region "${AWS_REGION}" --stack-name "${compute_stack}" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")
            case "${status}" in
              *_IN_PROGRESS)
                if [ "${SECONDS}" -ge "${deadline}" ]; then
                  echo "::error::${compute_stack} still ${status} after 30 minutes. Refusing to plan the API stack into a moving target."
                  exit 1
                fi
                echo "  ${compute_stack}: ${status} — waiting 20s"
                sleep 20
                ;;
              NOT_FOUND)
                echo "::error::Compute stack ${compute_stack} does not exist. The API stack references resources it creates."
                exit 1
                ;;
              *)
                echo "  ${compute_stack}: ${status}"
                break
                ;;
            esac
          done

          # A rolled-back compute stack may not carry the function this stack
          # needs. Say so plainly rather than discovering it at apply.
          case "${status}" in
            *ROLLBACK*|*FAILED*)
              echo "::warning::${compute_stack} is ${status}. The Lambda assertion below is what decides whether this deploy can proceed."
              ;;
          esac

          echo "Asserting ${authorizer_fn} exists..."
          if ! aws lambda get-function --function-name "${authorizer_fn}" \
                 --region "${AWS_REGION}" --query 'Configuration.FunctionArn' --output text; then
            echo "::error::${authorizer_fn} does not exist yet. 03-api.yaml's EscalationDecisionAuthorizerInvokePermission would CREATE_FAILED on 'Function not found', and the resulting rollback would orphan the authorizer (ENC-ISS-657). Let the compute stack deploy first, then re-run this workflow."
            exit 1
          fi

      - name: Create API stack change-set (no execute)
        id: changeset
        run: |
          set -euo pipefail

          aws cloudformation deploy \
            --region "${AWS_REGION}" \
            --stack-name "${{ steps.params.outputs.stack_name }}" \
            --template-file "${TEMPLATE_FILE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --no-execute-changeset \
            --s3-bucket enceladus-cfn-staging-us-west-2 \
            --s3-prefix 03-api/ \
            --parameter-overrides \
              ComputeStackName="${{ steps.params.outputs.compute_stack_name }}" \
              ApiName="${{ steps.params.outputs.api_name }}" 2>&1 | tee /tmp/plan.log

          if grep -q "No changes to deploy" /tmp/plan.log; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "changeset_arn=" >> "${GITHUB_OUTPUT}"
            {
              echo "## API stack plan — ${{ steps.params.outputs.stack_name }}"
              echo "No changes to deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changeset_arn=$(grep -oE 'arn:aws:cloudformation:[^ "]*changeSet/[^ "]*' /tmp/plan.log | head -1)
          if [ -z "${changeset_arn}" ]; then
            echo "::error::Change-set creation output did not contain a change-set ARN."
            exit 1
          fi
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "changeset_arn=${changeset_arn}" >> "${GITHUB_OUTPUT}"

      - name: Write change-set summary for the approval screen
        if: steps.changeset.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          {
            echo "## API stack plan — ${{ steps.params.outputs.stack_name }}"
            echo ""
            echo "Change-set: \`${{ steps.changeset.outputs.changeset_arn }}\`"
            echo ""
            echo '```'
            aws cloudformation describe-change-set \
              --region "${AWS_REGION}" \
              --change-set-name "${{ steps.changeset.outputs.changeset_arn }}" \
              --query 'Changes[].{Action:ResourceChange.Action,Resource:ResourceChange.LogicalResourceId,Type:ResourceChange.ResourceType,Replacement:ResourceChange.Replacement}' \
              --output table
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply API stack change-set
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ENC-FTR-120: v3-prod carries a required-reviewer rule (io); v4-gamma has
    # none. A main-branch run therefore pauses here as a rejectable request.
    environment: ${{ startsWith(github.ref, 'refs/heads/v4/') && 'v4-gamma' || 'v3-prod' }}

    steps:
      - name: Configure AWS credentials (environment-scoped OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLOUDFORMATION_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute reviewed change-set
        id: deploy
        run: |
          set -euo pipefail
          changeset_type=$(aws cloudformation describe-change-set \
            --region "${AWS_REGION}" \
            --change-set-name "${{ needs.plan.outputs.changeset_arn }}" \
            --query 'ChangeSetType' --output text 2>/dev/null || echo "UPDATE")
          aws cloudformation execute-change-set \
            --region "${AWS_REGION}" \
            --change-set-name "${{ needs.plan.outputs.changeset_arn }}"
          if [ "${changeset_type}" = "CREATE" ]; then
            aws cloudformation wait stack-create-complete \
              --region "${AWS_REGION}" \
              --stack-name "${{ needs.plan.outputs.stack_name }}"
          else
            aws cloudformation wait stack-update-complete \
              --region "${AWS_REGION}" \
              --stack-name "${{ needs.plan.outputs.stack_name }}"
          fi

      - name: Report stack events on failure
        if: failure() && steps.deploy.conclusion == 'failure'
        run: |
          echo "=== Stack events (last 20) ==="
          aws cloudformation describe-stack-events \
            --region "${AWS_REGION}" \
            --stack-name "${{ needs.plan.outputs.stack_name }}" \
            --query 'StackEvents[:20].{Time:Timestamp,Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
            --output table || echo "(describe-stack-events unavailable)"

      - name: Report deployed stack state
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${{ needs.plan.outputs.stack_name }}" \
            --query 'Stacks[0].{StackName:StackName,StackStatus:StackStatus,LastUpdatedTime:LastUpdatedTime}' \
            --output table
