name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'v4/**'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Python files
        run: |
          set -euo pipefail
          python3 -m py_compile \
            backend/lambda/coordination_api/lambda_function.py \
            tools/enceladus-mcp-server/server.py
          echo "[SUCCESS] Python syntax check passed"

      - name: Validate governance dictionary JSON
        run: |
          set -euo pipefail
          python3 -c "
          import json, sys
          with open('backend/lambda/coordination_api/governance_data_dictionary.json') as f:
              d = json.load(f)
          assert 'version' in d, 'Missing version field'
          assert 'entities' in d, 'Missing entities field'
          print('[SUCCESS] governance_data_dictionary.json is valid JSON with required fields')
          print(f'  version: {d[\"version\"]}')
          print(f'  entities: {list(d[\"entities\"].keys())}')
          "

      - name: Verify Lambda architecture parity
        run: |
          set -euo pipefail
          python3 tools/verify_lambda_arch_parity.py

      - name: Test Lambda package architecture parity guard (ENC-TSK-E19)
        run: |
          set -euo pipefail
          python3 -m unittest tools.test_verify_lambda_package_arch -v

      - name: Test blast-radius affected-target computation (ENC-TSK-J40)
        run: |
          set -euo pipefail
          python3 -m unittest tools.test_compute_affected_targets -v

      - name: Test post-deploy freshness assertion (ENC-ISS-519)
        run: |
          set -euo pipefail
          python3 -m unittest tools.test_assert_post_deploy_freshness -v

      # ENC-TSK-H22 (ENC-PLN-048 Obj 4.1): prove the env-parity gate catches a
      # template strip. Needs PyYAML (the gate's resolver parses CFN); no current
      # CI step imports yaml, so provision Python+PyYAML scoped to this step only.
      - name: Set up Python for env-parity strip proof
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Env-parity gate synthetic-strip proof (ENC-TSK-H22)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 tools/test_synthetic_strip_proof.py

      # DVP-TSK-671 (BRD B2-R2): the warehouse registration library claims
      # idempotency, full-refresh correctness, schema evolution, and a
      # transactional write ordering. The whole T2 contract rests on those
      # claims, so they are tested rather than asserted. Needs pyarrow for the
      # Parquet write path; the contract half of the suite runs without it.
      - name: Warehouse registration contract tests (DVP-TSK-671)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyarrow
          cd backend/lambda/shared_layer
          PYTHONPATH=python python3 -m unittest test_warehouse_registration -v

      # DVP-TSK-648/649 (BRD B3): the governance analytics mart's grain contract
      # is only a contract if violating it fails the build. This suite enforces
      # DOC-3391173F2A5C mechanically — the substitution test is parametrised
      # over all seven tables and fails on any free-text column name, because
      # per the grain contract the appearance of such a column IS the Risk R-4
      # drift signal rather than something a later review might catch. It also
      # asserts daily grain on every fact table, the mandatory freshness stamp,
      # zero partition keys (DOC-1E1EC5B7CE02), and that the four
      # awaiting-upstream spectral columns stay DECLARED-and-NULL (risk R-11).
      - name: Governance mart contract tests (DVP-TSK-648)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyarrow pytest
          python3 -m pytest backend/lambda/governance_mart -q

      # DVP-TSK-694/695/696 (BRD B6-R2): the platform health monitor's own
      # predicates. These tests carry the distinctions the checks exist to draw
      # — legitimate data growth vs snapshot-per-mutation partitioning, a
      # crawler on a warehouse prefix vs a crawler merely existing elsewhere in
      # the estate, an OOM read from the kernel log vs a RestartCount that reads
      # 0 through seven kills — and each of those distinctions is one an
      # implementation could plausibly get backwards while still looking right.
      - name: Platform health monitor tests (DVP-TSK-665)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pytest
          python3 -m pytest backend/lambda/platform_health -q

      # DVP-TSK-661 (BRD B5-R2): the ad-hoc promotion transform. The two
      # guarantees that most need a build to defend them are all-or-nothing
      # coercion and the D-4 no-agent constraint, because both are invisible on
      # the happy path — a promotion that works looks identical whether or not
      # a partial write is possible, and an agent-triggered promotion produces a
      # perfectly good table. So the suite asserts the NEGATIVE cases directly:
      # a failed promotion issues zero PutObject and zero CreateTable calls, and
      # an invocation carrying an agent session id is refused before the source
      # table is read. It also pins the three adhoc_probe_01.csv failure cases
      # (leading-zero zip codes, a literal NULL in an integer column, currency
      # requiring DECIMAL) and the R-6 invariant that no column ever arrives at
      # the promotion screen blank.
      - name: Ad-hoc promotion transform tests (DVP-TSK-661)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyarrow pytest
          python3 -m pytest backend/lambda/adhoc_promotion -q

      # ENC-TSK-M98 / ENC-ISS-538: gamma tracker mirror guardrails — diff
      # computation, direction-lock refusal, counter-reset step (stdlib-only).
      - name: Gamma tracker mirror tests (ENC-TSK-M98)
        run: |
          set -euo pipefail
          python3 tools/test_gamma_tracker_mirror.py

      # ENC-TSK-J65 / ENC-FTR-120: no agent-reachable git operation may mutate
      # v3-prod without the environment reviewer gate. Fail-closed: unclassified
      # workflows and ungated prod-mutating jobs fail CI here.
      - name: Prod-gate coverage guard (ENC-TSK-J65)
        run: |
          set -euo pipefail
          python3 tools/prod_gate_coverage_guard.py
          python3 -m unittest tools.test_prod_gate_coverage_guard
