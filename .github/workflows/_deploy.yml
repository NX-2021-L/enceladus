name: Deploy Lambda Artifacts (Gen2)

# ENC-FTR-090 / ENC-PLN-041 Phase 2 / ENC-TSK-F60
# ENC-TSK-G70: branch-based env routing. push to main → no-op (v3-prod is
# workflow_dispatch-only). push to v4/main → build + deploy v4-gamma.
#
# AC-1: Sole prod-IAM-assumer. GitHubActions-V*-DeployRole is assumed ONLY here.
#       push to v4/main → build (via _build.yml) then deploy to v4-gamma.
#       push to main → skipped (deploy chain rebuilt in ENC-TSK-G71 fires v3-prod via
#         post-gamma promotion + required-reviewer gate).
#       workflow_dispatch → deploy a pre-built SHA to the specified target_environment.
#       workflow_call → reusable entry point for programmatic callers.
#       Concurrency group keyed per-environment with cancel-in-progress=false.
#
# AC-2: GitHub Deployments API is the deploy-state store.
#       POST /deployments on entry; POST /deployments/N/statuses for
#       in_progress → success|failure. Zero DynamoDB writes for deploy state.
#
# AC-3: All legacy per-Lambda deploy workflows + deploy-orchestration.yml +
#       lambda-deploy-reusable.yml deleted in this PR.

on:
  push:
    branches: [main, v4/main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        type: choice
        options: [v3-prod, v4-gamma, v4-prod]
        required: true
      commit_sha:
        description: "40-char hex SHA to deploy (must be pre-built by _build.yml)"
        type: string
        required: true
      gamma_sha:
        # ENC-TSK-Q21 FR-8 (DOC-5368FE6515ED): the v4/main head_sha the promote
        # PR was cut from (github.event.pull_request.head.sha in
        # promote-merged-dispatch.yml). Optional: only carried on a v3-prod
        # promote dispatch. When present, promote_preflight asserts it is an
        # ancestor of commit_sha and that the delta between them touches no
        # deployable path (a promote is code gamma already validated, not a
        # vehicle for new runtime changes) — see tools/promote_preflight.py.
        description: "v4/main head_sha the promote PR was cut from (v3-prod promote only)"
        type: string
        required: false
      merged_at:
        # ENC-TSK-Q21 FR-10: promote-merged-dispatch.yml passes the promote
        # PR's actual github.event.pull_request.merged_at here, since this
        # path has no head_commit (workflow_dispatch, not push) for
        # record_deploy to read a timestamp from. Optional: only carried on
        # a v3-prod promote dispatch.
        description: "PR merged_at timestamp (ISO 8601) for the promote PR being deployed (v3-prod promote only)"
        type: string
        required: false
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      gamma_sha:
        type: string
        required: false
      merged_at:
        type: string
        required: false

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.target_environment || 'v4-gamma' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ARTIFACT_BUCKET: jreese-net
  ARTIFACT_KEY_PREFIX: lambda-artifacts

jobs:

  # ---------------------------------------------------------------------------
  # PROMOTE PREFLIGHT — ENC-TSK-Q21 FR-8 (DOC-5368FE6515ED): "promote is a
  # merge". Every run passes through this job (build needs it). For any run
  # that is NOT a v3-prod dispatch it is a trivial no-op success — the push
  # (gamma) path and non-prod dispatch/call paths are unaffected. For a
  # v3-prod workflow_dispatch/workflow_call it fails closed unless commit_sha
  # is a commit that has actually landed on origin/main (the promote PR
  # merged for real, not a hand-crafted dispatch), and — when gamma_sha is
  # carried — that gamma_sha is an ancestor of commit_sha with no deployable-
  # path delta between them (see tools/promote_preflight.py). build's `if:`
  # explicitly requires this job to have succeeded, so a failed preflight
  # blocks build (and therefore resolve/deploy) for that dispatch.
  # ---------------------------------------------------------------------------
  promote_preflight:
    name: Promote preflight (${{ inputs.target_environment || 'v4-gamma' }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip (not a v3-prod promote)
        if: inputs.target_environment != 'v3-prod'
        run: echo "not a v3-prod promote -- skipped"

      - name: Checkout (full history for ancestry check)
        if: inputs.target_environment == 'v3-prod'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v3-prod ancestry + deployable-delta preflight (ENC-TSK-Q21 FR-8)
        if: inputs.target_environment == 'v3-prod'
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GAMMA_SHA: ${{ inputs.gamma_sha }}
        run: |
          set -euo pipefail
          # ENC-TSK-Q21 review fix: the preceding actions/checkout@v4 with
          # fetch-depth:0 already gives full history reachable from the
          # checked-out ref (which includes gamma_sha via the merge commit's
          # second parent). A follow-up `git fetch --depth=1` here would
          # re-shallow an already-unshallow repo down to a single commit,
          # pruning gamma_sha and making `git merge-base --is-ancestor`
          # silently report "not an ancestor" (exit 1, no stderr) for every
          # legitimate promote -- a fail-closed but unusable outcome. Fetch
          # without --depth as a safety net only; never shallow here.
          git fetch origin main --quiet
          python3 tools/promote_preflight.py \
            --commit-sha "${COMMIT_SHA}" \
            --gamma-sha "${GAMMA_SHA}" \
            --main-ref origin/main

  # ---------------------------------------------------------------------------
  # BUILD — produces the Gen2 artifacts the deploy consumes.
  # Runs on: push-to-v4/main (gamma path, builds github.sha), AND
  #          workflow_dispatch / workflow_call (builds the caller-supplied SHA).
  # ENC-TSK-I60: dispatch/call previously skipped build and required artifacts to
  # have been pre-built by a v4/main push. v3-prod is workflow_dispatch-only and
  # in post-fork mode a main SHA never reaches v4/main, so its Gen2 artifacts
  # were never built — every dispatched v3-prod deploy failed at Resolve. Building
  # the target SHA here makes a dispatched deploy self-contained (build -> resolve
  # -> deploy) with zero out-of-band S3 artifact population.
  # push-to-main stays a no-op (build skipped -> resolve/deploy skipped).
  # ENC-TSK-Q21: build now additionally needs promote_preflight, and its `if:`
  # explicitly checks that job's result so a failed v3-prod preflight blocks
  # build rather than running anyway (a plain `if:` replaces the implicit
  # success() gate GitHub Actions would otherwise apply from `needs:`).
  # ---------------------------------------------------------------------------
  build:
    needs: [promote_preflight]
    if: |
      needs.promote_preflight.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref_name == 'v4/main') ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call'
      )
    uses: ./.github/workflows/_build.yml
    with:
      commit_sha: ${{ inputs.commit_sha || github.sha }}

  # ---------------------------------------------------------------------------
  # RESOLVE — parse env manifest, probe S3 for artifacts, emit deploy inputs.
  # Runs after build (push path) or immediately (dispatch/call path).
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve artifacts (${{ inputs.target_environment || 'v4-gamma' }})
    needs: [build, promote_preflight]
    # ENC-TSK-I60: build now runs on every deploy path (push-to-v4/main,
    # workflow_dispatch, workflow_call), so resolve simply requires it to have
    # succeeded. push-to-main is preserved as a no-op: build is skipped there, so
    # this condition is false and resolve (and deploy) are skipped.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      commit_sha:            ${{ steps.sha.outputs.commit_sha }}
      deploy_role_arn:       ${{ steps.manifest.outputs.deploy_role_arn }}
      environment:           ${{ steps.manifest.outputs.environment }}
      arch:                  ${{ steps.manifest.outputs.arch }}
      py_version:            ${{ steps.manifest.outputs.py_version }}
      canary_preference:     ${{ steps.manifest.outputs.canary_preference }}
      version_ids_json:      ${{ steps.probe.outputs.version_ids_json }}
      # ENC-TSK-Q05 AC-2: per-function resolved S3 key prefix ("<arch>-py<pyver>",
      # e.g. "lambda-artifacts/arm64-py3.12"), for exactly the functions this run
      # probed (narrowed or full-scope, same set as version_ids_json). Consumed by
      # the deploy job's architecture guard (tools/assert_artifact_arch_matches_functions.py)
      # to compare what is about to be shipped against what the target function
      # actually is (ENC-ISS-778 P0). Existing outputs above/below are unchanged.
      key_prefixes_json:     ${{ steps.probe.outputs.key_prefixes_json }}
      function_name_map_json: ${{ steps.manifest.outputs.function_name_map_json }}
      environment_suffix:    ${{ steps.manifest.outputs.environment_suffix }}
      codedeploy_app_name:   ${{ steps.manifest.outputs.codedeploy_app_name }}
      enable_snapstart:      ${{ steps.manifest.outputs.enable_snapstart }}
      full_scope:            ${{ steps.affected.outputs.full_scope }}
      affected_functions_json: ${{ steps.affected.outputs.affected_functions_json }}

    steps:
      # ENC-TSK-I60: pin to the target SHA so the `find backend/lambda` probe
      # enumerates exactly the function set that _build.yml built and that the
      # deploy job (which checks out commit_sha) will deploy. Without this the
      # probe runs against the workflow's branch HEAD, which drifts past the
      # deployed SHA over time and reintroduces missing-artifact failures.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Resolve commit SHA
        id: sha
        run: |
          SHA="${{ inputs.commit_sha || github.sha }}"
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Parse environment manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target_environment || 'v4-gamma' }}"
          MANIFEST="envs/${TARGET}.yaml"
          [[ -f "$MANIFEST" ]] || { echo "::error::Manifest not found: $MANIFEST"; exit 1; }

          _parse() { grep -E "^$1:" "$MANIFEST" | head -1 | sed 's/^[^:]*: *//' | tr -d "\"'"; }

          ROLE=$(_parse deploy_role_arn)
          ENV=$(_parse environment)

          # ENC-TSK-Q19 FR-1: envs/architecture.yaml is now the ONE canonical
          # architecture declaration; envs/<env>.yaml no longer carries
          # `architecture:`/`runtime:` literals (see architecture_plane
          # instead). The two `_parse` reads below are a backward-compat
          # first read for any manifest that still has the literal keys.
          # `_parse` is `grep -E ... | head | sed | tr`, and grep exits
          # non-zero when the key is absent -- `|| true` stops that from
          # aborting this step under `set -euo pipefail`; the resulting
          # empty string is what triggers the declaration fallback below.
          ARCH=$(_parse architecture || true)
          RUNTIME=$(_parse runtime || true)
          if [[ -z "$ARCH" || -z "$RUNTIME" ]]; then
            ARCH=$(python3 tools/arch_declaration.py --env "$TARGET" --field arch)
            RUNTIME=$(python3 tools/arch_declaration.py --env "$TARGET" --field runtime)
          fi
          [[ -n "$ARCH" ]] || { echo "::error::Could not resolve architecture for $TARGET (checked $MANIFEST literal and envs/architecture.yaml)"; exit 1; }
          [[ -n "$RUNTIME" ]] || { echo "::error::Could not resolve runtime for $TARGET (checked $MANIFEST literal and envs/architecture.yaml)"; exit 1; }
          PY="${RUNTIME#python}"
          CANARY=$(_parse canary_preference)
          # ENC-TSK-F63 AC-2/AC-3: SnapStart and CodeDeploy fields
          ENV_SUFFIX=$(_parse environment_suffix)
          CODEDEPLOY_APP=$(_parse codedeploy_app_name)
          # ENC-TSK-N79 / ENC-ISS-591: SnapStart intent from the manifest, enforced at
          # deploy time. Empty/missing defaults to "false" — snapshot cache bills per
          # retained published version with zero invocations, so absent intent must
          # fail toward no-cache.
          SNAPSTART=$(_parse enable_snapstart)
          [[ -n "$SNAPSTART" ]] || SNAPSTART="false"

          [[ -n "$ROLE" ]] || { echo "::error::deploy_role_arn missing in $MANIFEST"; exit 1; }

          FNMAP_JSON=$(python3 - "$MANIFEST" <<'PY'
          import json, re, sys
          content = open(sys.argv[1]).read()
          result = {}
          in_map = False
          for line in content.splitlines():
              if line.rstrip() == 'function_name_map:':
                  in_map = True
                  continue
              if in_map:
                  m = re.match(r'^  (\w+):\s+(\S+)', line)
                  if m:
                      result[m.group(1)] = m.group(2)
                  elif line and not line.startswith(' ') and not line.startswith('#'):
                      break
          print(json.dumps(result))
          PY
          )

          {
            echo "deploy_role_arn=$ROLE"
            echo "environment=$ENV"
            echo "arch=$ARCH"
            echo "py_version=$PY"
            echo "canary_preference=$CANARY"
            echo "function_name_map_json=$FNMAP_JSON"
            echo "environment_suffix=${ENV_SUFFIX}"
            echo "codedeploy_app_name=${CODEDEPLOY_APP}"
            echo "enable_snapstart=${SNAPSTART}"
          } >> "$GITHUB_OUTPUT"

          echo "Target=$TARGET  Arch=$ARCH  Runtime=$RUNTIME  Role=$ROLE"
          echo "function_name_map: $(echo "$FNMAP_JSON" | python3 -c 'import json,sys; m=json.load(sys.stdin); print(f"{len(m)} entries")')"

      - name: Compute affected-set (ENC-TSK-J40)
        id: affected
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DM_GITHUB_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 tools/compute_affected_targets.py \
            --environment "${{ steps.manifest.outputs.environment }}" \
            --head-sha "${{ steps.sha.outputs.commit_sha }}" \
            --repo "${{ github.repository }}"

      - name: Assert component deploy_targets coverage (ENC-TSK-J40 AC-2)
        if: steps.affected.outputs.full_scope == 'false'
        shell: bash
        env:
          COORDINATION_INTERNAL_API_KEY: ${{ secrets.COORDINATION_INTERNAL_API_KEY }}
        run: |
          set -euo pipefail
          python3 tools/assert_deploy_target_coverage.py \
            --affected-functions-json '${{ steps.affected.outputs.affected_functions_json }}'

      - name: Configure AWS credentials (build role — S3 artifact probe)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356364570033:role/GitHubActions-Build-Role
          aws-region: ${{ env.AWS_REGION }}

      - name: Probe S3 for artifacts and collect VersionIds
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ inputs.target_environment || 'v4-gamma' }}"
          SHA="${{ steps.sha.outputs.commit_sha }}"
          ARCH="${{ steps.manifest.outputs.arch }}"
          PY="${{ steps.manifest.outputs.py_version }}"
          KEY_PREFIX="${{ env.ARTIFACT_KEY_PREFIX }}/${ARCH}-py${PY}"
          BUCKET="${{ env.ARTIFACT_BUCKET }}"
          FULL_SCOPE="${{ steps.affected.outputs.full_scope }}"
          AFFECTED_JSON='${{ steps.affected.outputs.affected_functions_json }}'

          mapfile -t ALL_FNS < <(find backend/lambda -maxdepth 2 -name lambda_function.py \
            | sed -E 's|backend/lambda/([^/]+)/lambda_function.py|\1|' | sort -u)

          # ENC-TSK-J40 AC-1/AC-4: narrow to the affected set unless full_scope
          # (no prior deployment, cross-cutting change, or diff failure --
          # "ambiguity widens, never narrows", see tools/compute_affected_targets.py).
          if [[ "$FULL_SCOPE" == "true" ]]; then
            FNS=("${ALL_FNS[@]}")
            echo "Full-scope deploy: probing all ${#FNS[@]} functions."
          else
            mapfile -t AFFECTED < <(echo "$AFFECTED_JSON" | python3 -c 'import json,sys; [print(f) for f in json.load(sys.stdin)]')
            FNS=()
            for fn in "${ALL_FNS[@]}"; do
              for a in "${AFFECTED[@]}"; do
                if [[ "$fn" == "$a" ]]; then
                  FNS+=("$fn")
                  break
                fi
              done
            done
            echo "Narrowed deploy: probing ${#FNS[@]} of ${#ALL_FNS[@]} functions (affected-set: ${AFFECTED[*]:-none})."
            if [[ ${#FNS[@]} -eq 0 ]]; then
              echo "No affected functions and not full_scope -- nothing to deploy."
              echo "version_ids_json={}" >> "$GITHUB_OUTPUT"
              # ENC-TSK-Q05 AC-2: keep in lockstep with version_ids_json on the
              # empty-scope early exit -- an empty map here is what makes the
              # architecture guard's "no deploy targets" no-op fire correctly.
              echo "key_prefixes_json={}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # ENC-ISS-494 / ENC-ISS-778 (forward-ported from main during
          # ENC-TSK-Q21): mcp_code's key prefix is kept as an explicit
          # per-function override -- on v4/main this now equals KEY_PREFIX
          # exactly (the whole fleet is arm64/python3.12 since the Q20
          # cutover), but the FN_KEY_PREFIX conditional below is shared code
          # that expects this variable to be set whenever mcp_code is probed.
          MCP_CODE_KEY_PREFIX="${{ env.ARTIFACT_KEY_PREFIX }}/arm64-py3.12"

          echo "Probing ${#FNS[@]} Lambda functions for SHA=${SHA}, arch=${ARCH}-py${PY}"

          # ENC-TSK-Q20 FR-7 / DOC-5368FE6515ED: independently re-derive the
          # declared arch/runtime for this plane straight from
          # tools/arch_declaration.py -- NOT via the "Parse environment
          # manifest" step's _parse/fallback path -- and assert every
          # resolved key's arch segment matches it, BEFORE the S3
          # head-object existence probe and therefore before the deploy job
          # can ever run. This catches drift if a manifest still carries a
          # stale literal architecture:/runtime: value that the fallback in
          # that earlier step didn't need to reach.
          DECL_ARCH=$(python3 tools/arch_declaration.py --env "$TARGET" --field arch)
          DECL_RUNTIME=$(python3 tools/arch_declaration.py --env "$TARGET" --field runtime)
          DECL_PY="${DECL_RUNTIME#python}"
          DECL_SEGMENT="${DECL_ARCH}-py${DECL_PY}"
          PLANE_NAME=$(python3 -c "import sys; sys.path.insert(0, 'tools'); from arch_declaration import load_declaration; print(load_declaration().plane_for_env('$TARGET'))")

          assert_mismatch=0
          for fn in "${FNS[@]}"; do
            segment="${ARCH}-py${PY}"
            if [[ "$segment" != "$DECL_SEGMENT" ]]; then
              echo "::error::resolve arch assertion FAILED for fn=$fn: key segment=$segment declared=$DECL_SEGMENT (envs/architecture.yaml plane=$PLANE_NAME)"
              assert_mismatch=1
            fi
          done
          if [[ "$assert_mismatch" -eq 1 ]]; then
            exit 1
          fi
          echo "resolve arch assertion: ${#FNS[@]} keys == ${DECL_SEGMENT} (envs/architecture.yaml plane=${PLANE_NAME}) -- OK"

          MISSING=()
          > /tmp/vid_map.txt
          # ENC-TSK-Q05 AC-2: per-function resolved key prefix, written alongside
          # the VersionId map so the deploy job's architecture guard can compare
          # each function's artifact arch/py (encoded in this prefix) against its
          # live get-function-configuration -- BEFORE update-function-code runs.
          > /tmp/prefix_map.txt
          for fn in "${FNS[@]}"; do
            if [[ "$fn" == "mcp_code" ]]; then
              FN_KEY_PREFIX="$MCP_CODE_KEY_PREFIX"
            else
              FN_KEY_PREFIX="$KEY_PREFIX"
            fi
            KEY="${FN_KEY_PREFIX}/${fn}-${SHA}.zip"
            VID=$(aws s3api head-object \
              --bucket "$BUCKET" \
              --key "$KEY" \
              --query 'VersionId' --output text 2>/dev/null || echo "")
            if [[ -z "$VID" || "$VID" == "None" ]]; then
              MISSING+=("$fn")
            else
              printf '%s=%s\n' "$fn" "$VID" >> /tmp/vid_map.txt
              printf '%s=%s\n' "$fn" "$FN_KEY_PREFIX" >> /tmp/prefix_map.txt
            fi
          done

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Artifacts missing in S3 for SHA=${SHA} (arch=${ARCH}-py${PY}):"
            printf '  missing: %s\n' "${MISSING[@]}"
            echo "::error::The build job should have produced these (it runs on push-to-v4/main and on dispatch/call). Check the build job logs for this run; a partial build or a SHA/branch mismatch in the resolve checkout is the usual cause (ENC-TSK-I60)."
            exit 1
          fi

          VID_JSON=$(python3 - <<'PY'
          import json
          d = {}
          with open('/tmp/vid_map.txt') as f:
              for line in f:
                  line = line.strip()
                  if '=' in line:
                      k, v = line.split('=', 1)
                      d[k] = v
          print(json.dumps(d))
          PY
          )

          # ENC-TSK-Q05 AC-2: same map-file-to-JSON shape as VID_JSON above.
          PREFIX_JSON=$(python3 - <<'PY'
          import json
          d = {}
          with open('/tmp/prefix_map.txt') as f:
              for line in f:
                  line = line.strip()
                  if '=' in line:
                      k, v = line.split('=', 1)
                      d[k] = v
          print(json.dumps(d))
          PY
          )

          echo "version_ids_json=$VID_JSON" >> "$GITHUB_OUTPUT"
          echo "key_prefixes_json=$PREFIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved ${#FNS[@]} artifact VersionIds."

  # ---------------------------------------------------------------------------
  # DEPLOY — create GH Deployment, assume prod role, update all Lambdas.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy → ${{ needs.resolve.outputs.environment }}
    needs: resolve
    # GitHub Actions' implicit success() check evaluates the transitive job chain
    # build → resolve → deploy; a skipped ancestor (e.g. build on push-to-main,
    # which is a deliberate no-op) would make success() false and silently skip
    # deploy. This explicit condition runs deploy whenever resolve itself
    # succeeded, regardless of upstream skips. (ENC-TSK-I60: build now runs on
    # dispatch/call too, but this guard remains correct for the push-to-main path.)
    if: always() && needs.resolve.result == 'success'
    environment: ${{ needs.resolve.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Create GitHub Deployment
        id: create_deployment
        env:
          # ENC-TSK-F92 / ENC-ISS-297: dedicated read token isolates DM thin reader
          # from the shared GITHUB_TOKEN bucket consumed by agent sessions + CI runs.
          GH_TOKEN: ${{ secrets.DM_GITHUB_READ_TOKEN || github.token }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
          ENV: ${{ needs.resolve.outputs.environment }}
        run: |
          set -euo pipefail

          PAYLOAD=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'ref': os.environ['SHA'],
              'environment': os.environ['ENV'],
              'description': 'Gen2 deploy — ENC-FTR-090',
              'auto_merge': False,
              'required_contexts': [],
              # ENC-ISS-519: durable discriminator so tools/compute_affected_targets.py's
              # resolve_last_deployed_sha() can tell THIS Lambda code-deploy record apart
              # from the GitHub-managed Deployment that cloudformation-api-stack-deploy.yml
              # / cloudformation-compute-stack-deploy.yml auto-create for the same
              # environment/sha via their `apply` job's `environment:` attribute. Keep this
              # string in sync with LAMBDA_CODE_DEPLOY_TASK in
              # tools/compute_affected_targets.py.
              'task': 'lambda-artifacts',
          }))
          PY
          )
          DEPLOYMENT_ID=$(echo "$PAYLOAD" | gh api \
            --method POST \
            "/repos/$GITHUB_REPOSITORY/deployments" \
            --input - \
            --jq '.id')

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "Created GitHub Deployment #$DEPLOYMENT_ID (env=$ENV, sha=$SHA)"

      - name: Set deployment status → in_progress
        env:
          GH_TOKEN: ${{ secrets.DM_GITHUB_READ_TOKEN || github.token }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f description="Deploying Lambda artifacts"

      - name: Configure AWS credentials (prod deploy role — AC-1 sole assumer)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.resolve.outputs.deploy_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ENC-TSK-Q05 (ENC-ISS-778 P0): the primary checkout above is the
      # PROMOTED tree -- needs.resolve.outputs.commit_sha is whatever
      # v4/main SHA a v3-prod promote points at, and that tree does not
      # carry tools/ scripts that live only on main (this workflow's own
      # branch). Same shape as _build.yml's build-mcp-code "Checkout guard
      # tooling" step: fetch both AC-2/AC-3 guard scripts from the
      # workflow's own branch into a separate path instead of relying on
      # them being present in the (possibly foreign) promoted tree. Must
      # NOT be made conditional on the scripts existing in the primary
      # checkout -- that would disable both guards exactly when it matters
      # (every promote checks out a v4/main tree that lacks them).
      - name: Checkout guard tooling (workflow branch)
        uses: actions/checkout@v4
        with:
          ref: main
          path: .guard-tools
          sparse-checkout: |
            tools/assert_artifact_arch_matches_functions.py
            tools/post_deploy_smoke.py
          sparse-checkout-cone-mode: false

      # ENC-TSK-Q05 AC-2 (ENC-ISS-778 P0): compare what is about to be
      # shipped against what each target function actually IS, before any
      # update-function-code call. Fails closed on a mismatch, an
      # unparseable prefix, or an unreadable/ambiguous function
      # configuration; a not-yet-provisioned function (bootstrapping a new
      # environment) is a legitimate skip, not a failure -- see the
      # script's own docstring for the full fail-closed semantics.
      # Unconditional / no continue-on-error / no `|| true` by design: this
      # step existing at all is the fix, so it must not be possible to
      # silently disable it.
      - name: Assert deploy-time architecture guard (ENC-TSK-Q05 AC-2)
        env:
          FUNCTION_NAME_MAP_JSON: ${{ needs.resolve.outputs.function_name_map_json }}
          KEY_PREFIXES_JSON: ${{ needs.resolve.outputs.key_prefixes_json }}
        run: |
          set -euo pipefail
          python3 .guard-tools/tools/assert_artifact_arch_matches_functions.py \
            --function-name-map-json "${FUNCTION_NAME_MAP_JSON}" \
            --key-prefixes-json "${KEY_PREFIXES_JSON}" \
            --region "${{ env.AWS_REGION }}"

      # ENC-TSK-Q05 AC-3 (ENC-ISS-778 P0): capture each deploy target's
      # CURRENT 'live' alias version before it is overwritten below -- this
      # is the only place that version is ever observable, so it must run
      # before "Deploy Lambda functions", not after. A function with no
      # existing 'live' alias yet (bootstrap case) is simply absent from the
      # captured map; the post-deploy check step treats that as a clean
      # no-op (nothing to roll back to), never a failure.
      - name: Capture pre-deploy alias versions (ENC-TSK-Q05 AC-3)
        id: pre_deploy_versions
        env:
          FUNCTION_NAME_MAP_JSON: ${{ needs.resolve.outputs.function_name_map_json }}
          VERSION_IDS_JSON: ${{ needs.resolve.outputs.version_ids_json }}
        run: |
          set -euo pipefail
          VERSIONS_JSON=$(python3 .guard-tools/tools/post_deploy_smoke.py capture \
            --function-name-map-json "${FUNCTION_NAME_MAP_JSON}" \
            --version-ids-json "${VERSION_IDS_JSON}" \
            --region "${{ env.AWS_REGION }}" | tail -n 1)
          echo "previous_alias_versions_json=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"

      - name: Deploy Lambda functions
        id: lambda_deploy
        env:
          VERSION_IDS_JSON: ${{ needs.resolve.outputs.version_ids_json }}
          FUNCTION_NAME_MAP_JSON: ${{ needs.resolve.outputs.function_name_map_json }}
          SHA: ${{ needs.resolve.outputs.commit_sha }}
          ARCH: ${{ needs.resolve.outputs.arch }}
          PY_VERSION: ${{ needs.resolve.outputs.py_version }}
          # ENC-TSK-F63 AC-3: CodeDeploy canary preference from env manifest.
          # Empty string → direct alias update (AllAtOnce). Non-empty → CodeDeploy traffic shift.
          CANARY_PREFERENCE: ${{ needs.resolve.outputs.canary_preference }}
          ENVIRONMENT_SUFFIX: ${{ needs.resolve.outputs.environment_suffix }}
          # ENC-TSK-N79 / ENC-ISS-591: manifest SnapStart intent, enforced pre-publish.
          ENABLE_SNAPSTART: ${{ needs.resolve.outputs.enable_snapstart }}
        run: |
          set -euo pipefail
          python3 -u - <<'PY'
          # ENC-TSK-G69: Parallel kickoff via ThreadPoolExecutor + flush-on-print + 900s
          # per-deployment internal timeout. Compresses ~28-Lambda kickoff from ~14 min
          # (sequential) to ~2 min (8 workers), enabling sub-10-min end-to-end Gen2
          # dispatch. Mirrors the proven Sev1 brute-force pattern from ENC-ISS-305.
          import concurrent.futures, json, os, subprocess, sys, tempfile, threading, time

          version_ids     = json.loads(os.environ['VERSION_IDS_JSON'])
          fn_map          = json.loads(os.environ.get('FUNCTION_NAME_MAP_JSON') or '{}')
          canary_pref     = os.environ.get('CANARY_PREFERENCE', '').strip()
          bucket = 'jreese-net'
          # ENC-ISS-454: canonical artifacts live in jreese-net (us-west-1), but
          # `update-function-code --s3-bucket` requires the source bucket in the
          # function's region (us-west-2) — a cross-region bucket returns
          # PermanentRedirect. Each same-run artifact is copied here first, then
          # deployed by S3 reference (no ~70MB base64 direct-upload ceiling).
          staging_bucket = 'enceladus-lambda-artifacts-us-west-2'
          arch   = os.environ['ARCH']
          py     = os.environ['PY_VERSION']
          sha    = os.environ['SHA']
          prefix = f"lambda-artifacts/{arch}-py{py}"
          # ENC-ISS-494: mcp_code's live v3-prod runtime (arm64/python3.12) genuinely
          # diverges from this target's environment-wide arch/py above -- ENC-ISS-778
          # retired the BAD hardcoded pre-cutover value here (the P0 502 cause) but
          # kept the per-function override, now pointed at the correct prefix.
          mcp_code_prefix = "lambda-artifacts/arm64-py3.12"
          region = 'us-west-2'
          env_suffix = os.environ.get('ENVIRONMENT_SUFFIX', '')
          codedeploy_app = f"enceladus-lambda{env_suffix}"
          # ENC-TSK-N79 / ENC-ISS-591: manifest SnapStart intent. Anything but the
          # literal "true" means no snapshots (fail toward no-cache).
          enable_snapstart = os.environ.get('ENABLE_SNAPSTART', 'false').strip().lower() == 'true'

          # ENC-TSK-N80: hygiene must never re-approach the 1h OIDC credential
          # lifetime (run 30974760724: 3,939 denied deletes stretched the job to
          # 65 min and user_preferences_api died on ExpiredToken). Three bounds:
          # deny-trip breakers (a missing IAM verb is role-wide — one denial
          # proves every later attempt futile this run), a per-function delete
          # cap, and a global prune wall-clock budget measured from script start.
          _script_t0 = time.monotonic()
          PRUNE_MAX_PER_FN = 25
          PRUNE_TIME_BUDGET_S = 300
          _prune_denied = threading.Event()
          _heal_denied = threading.Event()

          CODEDEPLOY_CONFIG_MAP = {
              'Canary10Percent5Minutes':        'CodeDeployDefault.LambdaCanary10Percent5Minutes',
              'Canary10Percent10Minutes':       'CodeDeployDefault.LambdaCanary10Percent10Minutes',
              'Linear10PercentEvery1Minute':    'CodeDeployDefault.LambdaLinear10PercentEvery1Minute',
              'Linear10PercentEvery10Minutes':  'CodeDeployDefault.LambdaLinear10PercentEvery10Minutes',
              'AllAtOnce':                      'CodeDeployDefault.LambdaAllAtOnce',
          }
          use_codedeploy = canary_pref and canary_pref != 'AllAtOnce' and canary_pref in CODEDEPLOY_CONFIG_MAP

          # Hoisted out of the per-function loop: 1 sts call total instead of 1 per function.
          if use_codedeploy:
              account_id = subprocess.check_output(
                  ['aws', 'sts', 'get-caller-identity', '--query', 'Account', '--output', 'text'],
                  text=True,
              ).strip()
          else:
              account_id = ''

          # Mapping mirrors 07-codedeploy.yaml DeploymentGroup names. Hoisted out.
          DG_NAME_MAP = {
              'devops-coordination-api':        'coordination-api',
              'devops-tracker-mutation-api':    'tracker-mutation',
              'devops-document-api':            'document-api',
              'devops-graph-query-api':         'graph-query-api',
              'devops-project-service':         'project-service',
              'devops-feed-query-api':          'feed-query',
              'devops-coordination-monitor-api': 'coordination-monitor',
              'devops-deploy-intake':           'deploy-intake',
              'devops-reference-search':        'reference-search',
              'auth-refresh':                   'auth-refresh',
              'devops-deploy-orchestrator':     'deploy-orchestrator',
              'devops-deploy-finalize':         'deploy-finalize',
              'devops-deploy-decide':           'deploy-decide',
              'devops-feed-publisher':          'feed-publisher',
              'enceladus-governance-audit':     'governance-audit',
              'devops-doc-prep':                'doc-prep',
              'enceladus-bedrock-agent-actions': 'bedrock-agent-actions',
              'devops-changelog-api':           'changelog-api',
              'devops-graph-sync':              'graph-sync',
              'devops-opensearch-indexer':      'opensearch-indexer',
              'devops-opensearch-backfill':     'opensearch-backfill',
              'enceladus-neo4j-backup':         'neo4j-backup',
              'enceladus-graph-health-metrics': 'graph-health-metrics',
              'devops-env-drift-auditor':       'env-drift-auditor',
              'devops-deploy-parity-validator': 'deploy-parity-validator',
          }

          _print_lock = threading.Lock()
          def log(msg, err=False):
              # Serialize prints across worker threads so log lines don't interleave.
              # flush=True surfaces progress in real time (ENC-ISS-305 buffering fix).
              with _print_lock:
                  print(msg, file=(sys.stderr if err else sys.stdout), flush=True)

          _TRANSIENT = (
              'TooManyRequestsException', 'ThrottlingException', 'Throttling',
              'ResourceConflictException', 'update is in progress',
              'Rate exceeded', 'RequestTimeout', 'ServiceException',
              'InternalFailure', 'SlowDown',
          )

          def run_with_retry(cmd, what, attempts=4, skip_on=()):
              """ENC-ISS-454 isolation: run an AWS CLI command with bounded retry on
              transient/throttle errors. Returns the CompletedProcess (success OR
              non-transient failure — caller inspects returncode), or None if a
              skip_on marker matched (caller treats as skip). Retries never span
              functions: a stuck package exhausts only its own attempts."""
              last = None
              for i in range(1, attempts + 1):
                  last = subprocess.run(cmd, capture_output=True, text=True)
                  if last.returncode == 0:
                      return last
                  stderr = last.stderr or ''
                  if any(m in stderr for m in skip_on):
                      return None
                  if i == attempts or not any(m in stderr for m in _TRANSIENT):
                      return last
                  back = 2 ** i
                  tail = (stderr.strip().splitlines() or [str(last.returncode)])[-1]
                  log(f'  [retry {i}/{attempts}] {what}: {tail} — retrying in {back}s')
                  time.sleep(back)
              return last

          def prune_versions(mapped_name, keep_explicit):
              """ENC-TSK-N79 / ENC-ISS-591: delete stale published versions after the
              :live alias advances, so SnapStart snapshot cache and version clutter
              cannot accumulate (each retained version bills cache per GB-second with
              zero invocations). Keeps the three highest version numbers plus every
              explicitly-kept version (newly published; pre-deploy alias target /
              CodeDeploy CurrentVersion, so in-flight canaries stay intact). Versions
              referenced by any alias are additionally protected server-side — Lambda
              rejects their deletion, which lands in the warn path. Strictly
              non-fatal: cost hygiene must never fail a deploy.
              ENC-TSK-N80: deny-tripped, capped at PRUNE_MAX_PER_FN deletions per
              function, and skipped entirely once PRUNE_TIME_BUDGET_S has elapsed
              since script start — the backlog drains across deploys instead of
              one run racing the credential lifetime."""
              if _prune_denied.is_set():
                  return
              if time.monotonic() - _script_t0 > PRUNE_TIME_BUDGET_S:
                  log(f'  ~ {mapped_name}: prune skipped (run past {PRUNE_TIME_BUDGET_S}s prune budget)')
                  return
              try:
                  r = subprocess.run(
                      ['aws', 'lambda', 'list-versions-by-function',
                       '--function-name', mapped_name, '--region', region,
                       '--query', "Versions[?Version!='$LATEST'].Version",
                       '--output', 'json'],
                      capture_output=True, text=True)
                  if r.returncode != 0:
                      log(f'  [warn] prune {mapped_name}: list-versions failed: {(r.stderr or "").strip().splitlines()[-1] if r.stderr else r.returncode}')
                      return
                  versions = sorted((int(v) for v in json.loads(r.stdout)), reverse=True)
                  keep = {str(v) for v in versions[:3]}
                  keep |= {v for v in keep_explicit if v and v != '$LATEST'}
                  stale = [str(v) for v in versions if str(v) not in keep]
                  if not stale:
                      return
                  # ENC-TSK-N80: bounded drain — at most PRUNE_MAX_PER_FN per run.
                  deferred = max(0, len(stale) - PRUNE_MAX_PER_FN)
                  stale = stale[:PRUNE_MAX_PER_FN]
                  deleted = 0
                  for v in stale:
                      if _prune_denied.is_set():
                          return
                      d = subprocess.run(
                          ['aws', 'lambda', 'delete-function',
                           '--function-name', mapped_name, '--qualifier', v,
                           '--region', region],
                          capture_output=True, text=True)
                      if d.returncode == 0:
                          deleted += 1
                      elif 'AccessDeniedException' in (d.stderr or ''):
                          # Role-wide gap: one denial proves all later attempts futile.
                          _prune_denied.set()
                          log(f'::warning::prune disabled for this run — deploy role lacks lambda:DeleteFunction '
                              f'(version-qualified). Apply the grant via iam-v4gamma-deploy-role-lambda-lifecycle-patch.yml '
                              f'(durable fix: 04-github-roles.yaml V4GammaLambdaLifecycle). First denial: {mapped_name}:{v}')
                          return
                      else:
                          log(f'  [warn] prune {mapped_name}: version {v} not deleted: {(d.stderr or "").strip().splitlines()[-1] if d.stderr else d.returncode}')
                  log(f'  ~ {mapped_name}: pruned {deleted}/{len(stale)} stale version(s)'
                      + (f' ({deferred} deferred to later runs)' if deferred else '')
                      + f'; kept {{{", ".join(sorted(keep, key=int))}}}')
              except Exception as e:
                  log(f'  [warn] prune {mapped_name}: {e}')

          def deploy_one(fn, mapped_name, version_id):
              """Per-target pipeline: download artifact, update code, publish version,
              kick off CodeDeploy canary (or fall back to direct alias). Returns:
                {'fn', 'mapped_name', 'status', 'dep_id'?, 'error'?}
              status in {'codedeploy', 'direct', 'skip', 'error'}.
              ENC-ISS-398: mapped_name is passed explicitly so one shared build artifact
              (fn) can fan out to multiple target functions from a comma-list map value."""
              if not mapped_name:
                  log(f'[skip] {fn}  (not in function_name_map)')
                  return {'fn': fn, 'status': 'skip'}
              fn_prefix = mcp_code_prefix if fn == 'mcp_code' else prefix
              s3_key = f"{fn_prefix}/{fn}-{sha}.zip"
              log(f'[deploy] {fn} -> {mapped_name}  s3://{bucket}/{s3_key}@{version_id} (stage->{staging_bucket})')

              # ENC-TSK-N79 / ENC-ISS-591: enforce manifest SnapStart intent BEFORE
              # publish — update-function-code --publish bakes $LATEST's config into
              # the new version, and a SnapStart version bills snapshot cache per
              # GB-second continuously with zero invocations (the $13/day Aug-2026
              # incident: 209 drifted versions on enceladus-mcp-code-gamma). Heals
              # out-of-band drift on every deploy. Non-fatal: a failed heal costs one
              # bounded version-cache until the next prune, never a blocked deploy.
              if not enable_snapstart and not _heal_denied.is_set():
                  cfg = subprocess.run(
                      ['aws', 'lambda', 'get-function-configuration',
                       '--function-name', mapped_name, '--region', region,
                       '--query', 'SnapStart.ApplyOn', '--output', 'text'],
                      capture_output=True, text=True)
                  if cfg.returncode == 0 and cfg.stdout.strip() == 'PublishedVersions':
                      log(f'  ! {mapped_name}: SnapStart drift vs manifest enable_snapstart=false — healing to ApplyOn=None')
                      heal = run_with_retry(
                          ['aws', 'lambda', 'update-function-configuration',
                           '--function-name', mapped_name, '--region', region,
                           '--snap-start', 'ApplyOn=None'],
                          what=f'snapstart-heal {mapped_name}')
                      if heal is None or heal.returncode != 0:
                          detail = (heal.stderr.strip().splitlines()[-1] if heal and heal.stderr else 'skip marker')
                          if heal is not None and 'AccessDeniedException' in (heal.stderr or ''):
                              # ENC-TSK-N80: role-wide gap — trip once, warn once.
                              _heal_denied.set()
                              log(f'::warning::SnapStart heal disabled for this run — deploy role lacks '
                                  f'lambda:UpdateFunctionConfiguration. Apply the grant via '
                                  f'iam-v4gamma-deploy-role-lambda-lifecycle-patch.yml. First denial: {mapped_name}')
                          else:
                              log(f'  [warn] {mapped_name}: SnapStart heal failed ({detail}) — new version will snapshot, bounded by prune')
                      else:
                          subprocess.run(
                              ['aws', 'lambda', 'wait', 'function-updated-v2',
                               '--region', region, '--function-name', mapped_name],
                              check=False)

              # ENC-ISS-454: stage the exact same-run artifact version into the
              # us-west-2 staging bucket (server-side cross-region copy), then deploy
              # by S3 reference. Replaces the download + `--zip-file` inline upload,
              # whose base64-encoded request body pushed the ~62MB graph_query_api
              # package past the 70,167,211-byte UpdateFunctionCode request limit and
              # failed the whole atomic ~30-Lambda job.
              cp = run_with_retry(
                  ['aws', 's3api', 'copy-object',
                   '--region', region,
                   '--bucket', staging_bucket, '--key', s3_key,
                   '--copy-source', f'{bucket}/{s3_key}?versionId={version_id}'],
                  what=f'stage {fn}',
              )
              if cp is None or cp.returncode != 0:
                  detail = (cp.stderr.strip() if cp else 'skip marker')
                  log(f'::error::stage-to-{staging_bucket} failed for {fn}: {detail}', err=True)
                  return {'fn': fn, 'mapped_name': mapped_name, 'status': 'error', 'error': 'stage copy'}

              r = run_with_retry(
                  ['aws', 'lambda', 'update-function-code',
                   '--region', region, '--function-name', mapped_name,
                   '--s3-bucket', staging_bucket, '--s3-key', s3_key,
                   '--publish'],
                  what=f'update-function-code {mapped_name}',
                  skip_on=('ResourceNotFoundException', 'Function not found'),
              )
              if r is None:
                  log(f'  [skip] {mapped_name}: not provisioned in this environment yet')
                  return {'fn': fn, 'mapped_name': mapped_name, 'status': 'skip'}
              if r.returncode != 0:
                  log(f'::error::update-function-code failed for {mapped_name}: {r.stderr.strip()}', err=True)
                  return {'fn': fn, 'mapped_name': mapped_name, 'status': 'error', 'error': 'update-function-code'}

              try:
                  new_version = json.loads(r.stdout).get('Version', '')
              except (json.JSONDecodeError, KeyError):
                  new_version = ''
              if not new_version:
                  log(f'::error::could not parse Version from update-function-code for {mapped_name}', err=True)
                  return {'fn': fn, 'mapped_name': mapped_name, 'status': 'error', 'error': 'no version'}

              subprocess.run(
                  ['aws', 'lambda', 'wait', 'function-updated-v2',
                   '--region', region, '--function-name', mapped_name],
                  check=False,
              )

              # CodeDeploy canary path
              use_cd_succeeded = False
              if use_codedeploy:
                  try:
                      alias_r = subprocess.run(
                          ['aws', 'lambda', 'get-alias',
                           '--function-name', mapped_name, '--name', 'live',
                           '--region', region],
                          capture_output=True, text=True,
                      )
                      if alias_r.returncode == 0:
                          current_version = json.loads(alias_r.stdout).get('FunctionVersion', '$LATEST')
                      else:
                          current_version = '$LATEST'

                      if current_version == '$LATEST':
                          # Bootstrap: live alias points to $LATEST. CodeDeploy rejects
                          # $LATEST as CurrentVersion. Direct alias update; next deploy
                          # will use the canary path with a valid integer CurrentVersion.
                          log(f'  [bootstrap] {mapped_name}: live alias is $LATEST — direct alias update (next deploy will use CodeDeploy canary)')
                      else:
                          appspec = {
                              "version": 0.0,
                              "Resources": [{
                                  mapped_name: {
                                      "Type": "AWS::Lambda::Function",
                                      "Properties": {
                                          "Name": mapped_name,
                                          "Alias": "live",
                                          "CurrentVersion": current_version,
                                          "TargetVersion": new_version,
                                      }
                                  }
                              }]
                          }
                          base_name = mapped_name
                          if env_suffix and mapped_name.endswith(env_suffix):
                              base_name = mapped_name[:-len(env_suffix)]
                          dg_name = DG_NAME_MAP.get(base_name, base_name)
                          if env_suffix:
                              dg_name = f"{dg_name}{env_suffix}"
                          revision_json = json.dumps({
                              "revisionType": "AppSpecContent",
                              "appSpecContent": {"content": json.dumps(appspec)},
                          })
                          cd_r = subprocess.run(
                              ['aws', 'deploy', 'create-deployment',
                               '--application-name', codedeploy_app,
                               '--deployment-group-name', dg_name,
                               '--revision', revision_json,
                               '--region', region, '--output', 'json'],
                              capture_output=True, text=True,
                          )
                          if cd_r.returncode == 0:
                              dep_id = json.loads(cd_r.stdout).get('deploymentId', '')
                              log(f'  + {mapped_name} → CodeDeploy deployment {dep_id} ({canary_pref})')
                              if dep_id:
                                  # ENC-TSK-N79: prune keeps Current+Target, so the
                                  # in-flight canary shift is untouched.
                                  prune_versions(mapped_name, {new_version, current_version})
                                  return {'fn': fn, 'mapped_name': mapped_name,
                                          'status': 'codedeploy', 'dep_id': dep_id}
                              use_cd_succeeded = False
                          else:
                              log(f'  [warn] CodeDeploy create-deployment failed for {mapped_name}: {cd_r.stderr.strip()}')
                              log(f'  [warn] Falling back to direct alias update for {mapped_name}')
                  except Exception as e:
                      log(f'  [warn] CodeDeploy error for {mapped_name}: {e}', err=True)

              # Direct alias update fallback (canary disabled/AllAtOnce/CD-failed/bootstrap)
              alias_r = subprocess.run(
                  ['aws', 'lambda', 'update-alias',
                   '--function-name', mapped_name, '--name', 'live',
                   '--function-version', new_version, '--region', region],
                  capture_output=True, text=True,
              )
              if alias_r.returncode != 0:
                  create_r = subprocess.run(
                      ['aws', 'lambda', 'create-alias',
                       '--function-name', mapped_name, '--name', 'live',
                       '--function-version', new_version, '--region', region],
                      capture_output=True, text=True, check=False,
                  )
                  if create_r.returncode != 0:
                      # ENC-ISS-418: fail loud — do NOT swallow alias errors. The V4Gamma
                      # deploy role previously lacked lambda:UpdateAlias/CreateAlias, so both
                      # the update and the create silently AccessDenied while we still logged a
                      # false 'live:N (direct)' success — freezing gamma :live at v81 for ~2
                      # days (published-but-not-served). Raise so the worker records an error
                      # and the deploy exits non-zero.
                      err = ((alias_r.stderr or '').strip() + ' || ' + (create_r.stderr or '').strip()).strip()
                      log(f'  [ERROR] {mapped_name}: could not advance :live to {new_version} '
                          f'(update-alias AND create-alias both failed): {err}', err=True)
                      raise RuntimeError(
                          f'{mapped_name}: failed to advance :live alias to {new_version}: {err}'
                      )
              log(f'  + {mapped_name} → live:{new_version} (direct)')
              prune_versions(mapped_name, {new_version})
              return {'fn': fn, 'mapped_name': mapped_name, 'status': 'direct'}

          # ============================================================
          # PARALLEL KICKOFF — 8-worker pool
          # ============================================================
          # ENC-ISS-398: expand each built artifact (fn) into one deploy unit per target
          # function. A function_name_map value may be a comma-separated list (e.g.
          # checkout_service -> 'enceladus-checkout-service-gamma,...-auto-gamma') so one
          # shared artifact updates several Lambda functions. Single-name values produce
          # exactly one unit and behave identically to the prior 1:1 mapping.
          deployments = []  # list of (fn, mapped_name, dep_id)
          errors = []
          skipped = []
          results = []      # every deploy_one outcome, for the per-function summary
          deploy_units = []  # list of (fn, mapped_name, version_id)
          for fn, vid in sorted(version_ids.items()):
              names = [n.strip() for n in (fn_map.get(fn) or '').split(',') if n.strip()]
              if not names:
                  log(f'[skip] {fn}  (not in function_name_map)')
                  skipped.append(fn)
                  continue
              for mapped_name in names:
                  deploy_units.append((fn, mapped_name, vid))
          log(f'Kicking off {len(deploy_units)} Lambda updates with 8-worker pool...')
          t_kickoff = time.time()
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              futures = {pool.submit(deploy_one, fn, mapped_name, vid): (fn, mapped_name)
                         for fn, mapped_name, vid in deploy_units}
              for fut in concurrent.futures.as_completed(futures):
                  try:
                      result = fut.result()
                  except Exception as e:
                      fn, mapped_name = futures[fut]
                      log(f'::error::worker exception on {fn} -> {mapped_name}: {e}', err=True)
                      errors.append(fn)
                      results.append({'fn': fn, 'mapped_name': mapped_name,
                                      'status': 'error', 'error': f'worker exception: {e}'})
                      continue
                  results.append(result)
                  fn = result['fn']
                  if result['status'] == 'codedeploy':
                      deployments.append((fn, result['mapped_name'], result['dep_id']))
                  elif result['status'] == 'skip':
                      skipped.append(fn)
                  elif result['status'] == 'error':
                      errors.append(fn)
                  # 'direct' = success already finalized; nothing to track for wait phase
          log(f'Kickoff phase complete in {time.time() - t_kickoff:.1f}s')

          # ============================================================
          # CODEDEPLOY WAIT — parallel poll, 900s per-deployment timeout (was 3600s)
          # ============================================================
          PER_DEPLOY_TIMEOUT_S = 900
          cd_failed_ids = set()
          if deployments:
              log(f'Waiting for {len(deployments)} CodeDeploy deployment(s)...')
              t_wait = time.time()
              deadline = t_wait + PER_DEPLOY_TIMEOUT_S
              pending = list(deployments)
              while pending and time.time() < deadline:
                  time.sleep(30)
                  still_pending = []
                  for fn, mapped_name, dep_id in pending:
                      status_r = subprocess.run(
                          ['aws', 'deploy', 'get-deployment',
                           '--deployment-id', dep_id, '--region', region,
                           '--query', 'deploymentInfo.status', '--output', 'text'],
                          capture_output=True, text=True,
                      )
                      status = status_r.stdout.strip()
                      if status in ('Succeeded', 'Failed', 'Stopped'):
                          if status == 'Succeeded':
                              log(f'  ✓ {mapped_name} CodeDeploy {dep_id}: {status}')
                          else:
                              log(f'::error::CodeDeploy {dep_id} for {mapped_name}: {status}', err=True)
                              errors.append(fn)
                              cd_failed_ids.add(dep_id)
                      else:
                          still_pending.append((fn, mapped_name, dep_id))
                  pending = still_pending
              if pending:
                  for fn, mapped_name, dep_id in pending:
                      log(f'::error::CodeDeploy {dep_id} for {mapped_name} did not reach terminal state in {PER_DEPLOY_TIMEOUT_S}s — investigate deployment group config (alarm-rollback, hooks, MinimumHealthyHosts)', err=True)
                      errors.append(fn)
                      cd_failed_ids.add(dep_id)
              log(f'Wait phase complete in {time.time() - t_wait:.1f}s')

          # ------------------------------------------------------------------
          # Per-function pass/fail summary (ENC-ISS-454 isolation AC): one bad
          # package shows as ONE red row while the other functions are plainly
          # green — no more reading a wall of logs to learn what actually shipped.
          # ------------------------------------------------------------------
          def _row(r):
              name = r.get('mapped_name') or r['fn']
              st = r['status']
              if st == 'codedeploy':
                  ok = r.get('dep_id') not in cd_failed_ids
                  return ('✅' if ok else '❌', name, 'codedeploy',
                          f"deployment {r.get('dep_id', '')} " + ('ok' if ok else 'FAILED/timeout'))
              if st == 'direct':
                  return ('✅', name, 'direct', 'alias updated')
              if st == 'skip':
                  return ('⏭️', name, 'skip', r.get('error') or 'no mapping / not provisioned')
              return ('❌', name, 'error', r.get('error') or 'error')

          rows = [_row(r) for r in sorted(results, key=lambda x: (x.get('mapped_name') or x['fn']))]
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              n_ok = sum(1 for row in rows if row[0] == '✅')
              n_skip = sum(1 for row in rows if row[0] == '⏭️')
              n_bad = sum(1 for row in rows if row[0] == '❌')
              with open(summary_path, 'a') as sf:
                  sf.write(f"### Gen2 Lambda deploy — {os.environ.get('ENVIRONMENT_SUFFIX') or 'prod'} @ {sha[:7]}\n\n")
                  sf.write(f"**{n_ok} deployed · {n_skip} skipped · {n_bad} failed** "
                           f"— S3-reference via `{staging_bucket}`\n\n")
                  sf.write("| | Function | Path | Detail |\n|---|---|---|---|\n")
                  for icon, name, path, detail in rows:
                      sf.write(f"| {icon} | `{name}` | {path} | {detail} |\n")

          deployed = len(version_ids) - len(skipped) - len(errors)
          if skipped:
              log(f'Skipped {len(skipped)} functions with no env mapping or not provisioned: {", ".join(skipped)}')
          if errors:
              log(f'::error::Deploy failed for: {", ".join(sorted(set(errors)))} — see the per-function summary table', err=True)
              sys.exit(1)

          log(f'Deployed {deployed} Lambda functions  {arch}-py{py} @ {sha[:7]}')
          PY

      # ENC-ISS-519 assertion: candidates 2+3 harden the *decision* of what to
      # diff/deploy; this is the backstop that catches ANY other way a
      # "0 Lambda updates but green run" false-positive could still slip
      # through. Gamma-only (see the header comment): prod already carries
      # its own CodeDeploy alarm-rollback + required-reviewer gate, and this
      # step must never be the thing that risks that path. If it fails, this
      # step's own non-zero exit fails the job, so the existing
      # `if: success()` / `if: failure()` deployment-status steps below react
      # correctly without any change to them.
      - name: Assert post-deploy freshness (ENC-ISS-519)
        if: contains(needs.resolve.outputs.environment, 'gamma')
        env:
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          FULL_SCOPE: ${{ needs.resolve.outputs.full_scope }}
          AFFECTED_FUNCTIONS_JSON: ${{ needs.resolve.outputs.affected_functions_json }}
          FUNCTION_NAME_MAP_JSON: ${{ needs.resolve.outputs.function_name_map_json }}
        run: |
          set -euo pipefail
          python3 tools/assert_post_deploy_freshness.py \
            --commit-sha "${COMMIT_SHA}" \
            --full-scope "${FULL_SCOPE}" \
            --affected-functions-json "${AFFECTED_FUNCTIONS_JSON}" \
            --function-name-map-json "${FUNCTION_NAME_MAP_JSON}" \
            --region "${{ env.AWS_REGION }}"

      # ENC-ISS-663 / ENC-TSK-P03: CloudFormation owns the function resource and
      # deploy.sh owns its code, and until now nothing reconciled the two. On
      # 2026-08-23 a template-only change created three gamma functions carrying
      # 02-compute.yaml's placeholder body; the deploy narrowed to an empty
      # affected-set, logged "nothing to deploy" and went GREEN, and all three
      # returned Runtime.ImportModuleError on every invocation while the stack
      # read UPDATE_COMPLETE and every other guard passed.
      #
      # compute_affected_targets.py now widens to full scope when 02-compute.yaml
      # changes, which prevents that CAUSE. This asserts the STATE, so a stuck
      # deploy, a rollback, a manual replacement, or a future edit that removes
      # the widening rule is still caught. Needs only lambda:GetFunction -- no
      # invoke permission -- so it runs on every gamma deploy unconditionally.
      #
      # It reads the deploy's OWN function_name_map rather than enumerating the
      # account: the deploy role has no lambda:ListFunctions (confirmed live, run
      # 32624487071 -- the guard's first version died on exactly that), and
      # checking the functions this deploy was responsible for is the more precise
      # question anyway. Requesting a ListFunctions grant to satisfy a guard would
      # have been the wrong trade, and is the ENC-ISS-660 pattern in miniature.
      - name: Assert no placeholder Lambdas (ENC-ISS-663)
        if: contains(needs.resolve.outputs.environment, 'gamma')
        env:
          FUNCTION_NAME_MAP_JSON: ${{ needs.resolve.outputs.function_name_map_json }}
        run: |
          set -euo pipefail
          python3 tools/assert_no_placeholder_lambdas.py \
            --function-name-map-json "${FUNCTION_NAME_MAP_JSON}" \
            --region "${{ env.AWS_REGION }}"
      # ENC-TSK-Q05 AC-3 (ENC-ISS-778 P0): probe each deployed function's
      # public endpoint (data-driven PROBE_TABLE, seeded with
      # enceladus-mcp-code / mcp.jreese.net -- the incident surface, which
      # 502'd on both routes) with retry/backoff for cold-start tolerance.
      # On failure, automatically restores the 'live' alias to the version
      # captured above and fails the run -- whether or not the rollback
      # itself succeeds, because a fired rollback means this deploy shipped
      # something broken and must be investigated. A function with no
      # PROBE_TABLE entry, or no captured previous version, is a clean
      # no-op (reported distinctly, never mistaken for a verified pass).
      # `if: success()` intentionally: a deploy that already failed upstream
      # has nothing here worth probing.
      - name: Post-deploy smoke test with automatic rollback (ENC-TSK-Q05 AC-3)
        if: success()
        env:
          FUNCTION_NAME_MAP_JSON: ${{ needs.resolve.outputs.function_name_map_json }}
          VERSION_IDS_JSON: ${{ needs.resolve.outputs.version_ids_json }}
          PREVIOUS_ALIAS_VERSIONS_JSON: ${{ steps.pre_deploy_versions.outputs.previous_alias_versions_json }}
          ENVIRONMENT_SUFFIX: ${{ needs.resolve.outputs.environment_suffix }}
        run: |
          set -euo pipefail
          python3 .guard-tools/tools/post_deploy_smoke.py check \
            --function-name-map-json "${FUNCTION_NAME_MAP_JSON}" \
            --version-ids-json "${VERSION_IDS_JSON}" \
            --previous-alias-versions-json "${PREVIOUS_ALIAS_VERSIONS_JSON}" \
            --region "${{ env.AWS_REGION }}" \
            --environment-suffix="${ENVIRONMENT_SUFFIX}"

      - name: Set deployment status → success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.DM_GITHUB_READ_TOKEN || github.token }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f description="${{ needs.resolve.outputs.environment }}: all Lambdas deployed"

      - name: Set deployment status → failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.DM_GITHUB_READ_TOKEN || github.token }}
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.deployment_id }}
        run: |
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=failure \
            -f description="Deploy failed — ${{ needs.resolve.outputs.environment }}"

  # ---------------------------------------------------------------------------
  # RECORD_DEPLOY — write a DPL record so deploy.history stays current (ENC-ISS-451).
  # The Gen2 pipeline previously had zero DynamoDB writes for deploy state (AC-2),
  # leaving deploy.history frozen at April 2026. This job closes that gap by POSTing
  # to the tracker deploy submit endpoint after every successful v4/main gamma deploy.
  #
  # continue-on-error: true — telemetry failure MUST NEVER block or fail the deploy.
  # Only runs on push to v4/main (actual gamma deploys); skipped on workflow_dispatch
  # and workflow_call which already have their own deploy-submit flows.
  # ---------------------------------------------------------------------------
  record_deploy:
    name: Record deploy → DPL (ENC-ISS-451)
    needs: [resolve, deploy]
    # ENC-TSK-Q21 FR-10: also record a v3-prod promote deploy (dispatched by
    # promote-merged-dispatch.yml after the promote PR merges to main), not
    # only the gamma push path. The gamma DPL behaviour below is unchanged.
    if: >-
      always() && needs.deploy.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref_name == 'v4/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'v3-prod')
      )
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Fetch current governance hash
        id: govhash
        env:
          COORDINATION_INTERNAL_API_KEY: ${{ secrets.COORDINATION_INTERNAL_API_KEY }}
        run: |
          HASH=$(curl -sf \
            -H "X-Coordination-Internal-Key: ${COORDINATION_INTERNAL_API_KEY}" \
            -H "Accept: application/json" \
            "https://jreese.net/api/v1/health" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('governance_hash',''))" 2>/dev/null || true)
          echo "governance_hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Governance hash: ${HASH:-(fetch failed)}"

      - name: Extract PR number for merge commit
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.DM_GITHUB_READ_TOKEN || github.token }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Primary: GitHub API — find PR(s) associated with this merge commit
          PR_NUMBER=$(gh api "/repos/$GITHUB_REPOSITORY/commits/${COMMIT_SHA}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)

          # Fallback: parse "(#NNN)" or "Merge pull request #NNN" from commit message
          if [ -z "$PR_NUMBER" ]; then
            MSG="$HEAD_COMMIT_MESSAGE"
            PR_NUMBER=$(echo "$MSG" | grep -oE '(^Merge pull request #|#)[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          fi

          echo "pr_number=${PR_NUMBER:-0}" >> "$GITHUB_OUTPUT"
          echo "PR number: ${PR_NUMBER:-(not found, using 0)}"

      - name: Submit DPL deploy record
        id: submit
        env:
          COORDINATION_INTERNAL_API_KEY: ${{ secrets.COORDINATION_INTERNAL_API_KEY }}
          GOVERNANCE_HASH: ${{ steps.govhash.outputs.governance_hash }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          DEPLOY_ROLE_ARN: ${{ needs.resolve.outputs.deploy_role_arn }}
          COMMIT_SHA: ${{ needs.resolve.outputs.commit_sha }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          # ENC-TSK-Q21 FR-10: github.event.head_commit only exists on the
          # push-to-v4/main (gamma) path. On the v3-prod workflow_dispatch
          # promote path it is undefined, so prefer the caller-supplied
          # inputs.merged_at (the promote PR's real merge time, passed by
          # promote-merged-dispatch.yml) over head_commit.timestamp.
          MERGED_AT: ${{ inputs.merged_at || github.event.head_commit.timestamp }}
          # ENC-TSK-Q21 FR-10: only set on the v3-prod promote-dispatch path
          # (empty on the gamma push path -- the python below treats "" as
          # "not carried").
          GAMMA_SHA: ${{ inputs.gamma_sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os
          pr_raw = os.environ.get('PR_NUMBER', '0')
          pr_id = int(pr_raw) if pr_raw.isdigit() else 0
          sha = os.environ['COMMIT_SHA']
          env = os.environ['ENVIRONMENT']
          gamma_sha = os.environ.get('GAMMA_SHA', '') or ''
          # ENC-TSK-Q21 FR-8/FR-10: the gamma push path deploys github.sha
          # straight off v4/main; the v3-prod promote path deploys a main
          # merge commit that was dispatched (never pushed) -- record which
          # lane this DPL record came from.
          branch = 'main' if os.environ.get('TRIGGER_EVENT') == 'workflow_dispatch' else 'v4/main'
          changes = [
              f"commit_sha: {sha}",
              f"branch: {branch}",
              f"environment: {env}",
              "workflow: _deploy.yml / Deploy Lambda Artifacts (Gen2)",
          ]
          if gamma_sha:
              changes.append(f"gamma_sha: {gamma_sha}")
          print(json.dumps({
              "project_id": "enceladus",
              "change_type": "patch",
              "deployment_type": "lambda_update",
              "summary": f"Gen2 Lambda deploy to {env} @ {sha[:7]} (PR #{pr_id})",
              "changes": changes,
              "pr_id": pr_id,
              "merged_at": os.environ['MERGED_AT'],
              "pr_owner": "NX-2021-L",
              "pr_repo": "enceladus",
              "submitted_by": "gha-deploy-pipeline",
              "non_ui_config": {
                  "service_group": "lambda",
                  "target_arn": f"arn:aws:lambda:us-west-2:356364570033:function:devops-tracker-mutation-api{'-gamma' if 'gamma' in env else ''}",
              },
              "governance_hash": os.environ['GOVERNANCE_HASH'],
              # ENC-TSK-Q21 FR-10 (DOC-5368FE6515ED): free-form fields beyond
              # the ones the API reads today -- the main merge sha (commit_sha
              # above), the gamma head sha this promote traces back to, and
              # the target environment, so DPL carries full promote lineage.
              "commit_sha": sha,
              "gamma_sha": gamma_sha or None,
              "target_environment": env,
          }))
          PY
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "X-Coordination-Internal-Key: ${COORDINATION_INTERNAL_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY" \
            "https://8nkzqkmxqc.execute-api.us-west-2.amazonaws.com/api/v1/deploy/submit")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

          echo "Response (HTTP $HTTP_CODE): $HTTP_BODY"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            DEPLOY_ID=$(echo "$HTTP_BODY" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('deploy_id') or d.get('request_id') or d.get('spec_id') or 'unknown')" \
              2>/dev/null || echo "unknown")
            echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
            echo "✅ DPL record written: ${DEPLOY_ID}"
          else
            echo "deploy_id=failed-http-${HTTP_CODE}" >> "$GITHUB_OUTPUT"
            echo "⚠️ DPL record submit failed (HTTP ${HTTP_CODE}) — deploy succeeded, telemetry gap only"
            # Exit 1 so the step shows as failed in the UI, but continue-on-error: true
            # at job level means the overall workflow is not affected.
            exit 1
          fi
