name: Deploy UI (ui-v2 PWA)

# ENC-TSK-K53 / T2 — v4 UI Deploy Pipeline (DOC-3EE4F709EC98 L2).
#
# Ships the frontend/ui-v2 PWA 2.0 build to the S3 origin + CloudFront
# distribution stood up by T1 (07-ui-cdn.yaml via
# cloudformation-ui-cdn-stack-deploy.yml, stack enceladus-ui-cdn${suffix}).
#
# Branch-based env routing, mirroring cloudformation-ui-cdn-stack-deploy.yml
# and _deploy.yml:
#   push to v4/main -> build + deploy v4-gamma (ungated) — the ONLY gamma publish lane.
#   push to other v4/** -> build ONLY (ENC-TSK-M89 — no feature-branch gamma races).
#   push to main   -> environment v3-prod (io required-reviewer) — the deploy
#                     PAUSES as a reviewable, rejectable request instead of
#                     flipping prod directly (the ENC-FTR-120 invariant).
#
# The BUILD job is env-agnostic (no AWS, no environment) and produces dist/ as
# an artifact. The DEPLOY job is the ONLY environment-scoped, AWS-mutating job:
# it resolves the S3 bucket + CloudFront distribution id from the T1 stack's
# CFN exports at runtime (never hardcoded) and syncs dist/ with a cache-control
# split: content-hashed assets (assets/*, workbox-*.js) are immutable for a year;
# the app shell (index.html and every other non-hashed file: sw.js,
# manifest.webmanifest, notify-sw.js, ...) is "public,max-age=0,must-revalidate".
# ENC-TSK-R37 (C3.4): there is NO CloudFront invalidation. The distribution uses
# the managed CachingOptimized policy (MinTTL 1s), which honors the origin
# Cache-Control, so a revalidating index.html reaches viewers within seconds of
# the S3 put. The deploy then WAITS on the viewer path (ENC-TSK-M88 — a green
# deploy is not evidence users receive the build until the edge serves the
# fresh index.html): the gate polls /index.html until it references the deployed
# entry bundle, which is the proof that no invalidation is needed. record_deploy
# writes a DPL telemetry record (ENC-ISS-451 mechanism) after a successful
# deploy, and never blocks it.
#
# Escalated prereq (deploy role): this workflow assumes AWS_UI_DEPLOY_ROLE_TO_ASSUME
# when present, else falls back to AWS_CLOUDFORMATION_ROLE_TO_ASSUME. The
# UI-deploy role needs, scoped to the UI bucket + distribution:
#   s3:PutObject, s3:DeleteObject, s3:ListBucket  (on enceladus-ui-v2${suffix} + /*)
#   s3:GetObject                                   (for --delete diffing)
#   cloudformation:DescribeStacks                  (to read the T1 stack exports)
# ENC-TSK-R37: cloudfront:CreateInvalidation is no longer used by this workflow
# (the IAM grant in 04-github-roles.yaml is left in place; removing it is a
# separate IAM change). Freshness is gated on the VIEWER path (index.html
# references the deployed entry bundle), not on any CloudFront API.
# These are io-gated to add as an ATTACHED managed policy (the CFN deploy role's
# inline quota is exhausted — J85 / PR #733 pattern) BEFORE the first deploy if
# the fallback CFN role is used, or the s3 sync AccessDenies.

on:
  push:
    branches:
      - main
      - 'v4/**'
    paths:
      - "frontend/ui-v2/**"
      - ".github/workflows/_ui_deploy.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this UI deploy is being triggered"
        type: string
        required: false
        default: "manual ui-v2 deploy"
      # ENC-TSK-P52 / ENC-ISS-708: post-cutover, v4/main is the production
      # branch of record, but ui-v2 exists only on v4/** refs while this lane
      # derived the prod plane exclusively from ref main — so the prod deploy
      # was unreachable from the code that defines it (the ENC-TSK-P40 dead-end
      # class). Mirrors cloudformation-compute-stack-deploy.yml: empty keeps the
      # historical ref-derived routing (push events never supply it);
      # 'production' deploys prod from a trusted v4 ref, still pausing at the
      # v3-prod required-reviewer Environment (ENC-FTR-120 invariant intact).
      target_environment:
        description: "Override the target plane (empty = derive from ref, as before). 'production' pauses at the v3-prod required-reviewer gate before deploying."
        type: choice
        required: false
        default: ""
        options: ["", "gamma", "production"]

permissions:
  contents: read
  id-token: write

concurrency:
  # v4/main merges serialize on one gamma lane (last completed wins). A v4/main
  # dispatch with target_environment=production gets its own ref-named group so
  # a prod deploy never serializes with (or is blocked by) the gamma push lane.
  group: ui-deploy-${{ (github.ref_name == 'v4/main' && github.event.inputs.target_environment != 'production') && 'v4-gamma' || github.ref_name }}
  # ENC-TSK-R25: the v4-gamma lane cancels a superseded in-flight run (the newest
  # merge wins; each run re-syncs the full dist/). Prod (main ref, or a v4/main
  # production dispatch) stays queued so a prod deploy is never cancelled.
  cancel-in-progress: ${{ github.ref == 'refs/heads/v4/main' && github.event.inputs.target_environment != 'production' }}

env:
  AWS_REGION: us-west-2
  # Env-conditional suffix — mirrors cloudformation-ui-cdn-stack-deploy.yml.
  # Resolution order (ENC-TSK-P52, P40 pattern — written gamma-first because
  # GitHub Actions treats '' as falsy): explicit 'gamma' input, OR no input +
  # v4/main ref => '-gamma' (stack enceladus-ui-cdn-gamma); anything else
  # (explicit 'production', or a main-ref event) => '' (prod).
  ENVIRONMENT_SUFFIX: ${{ (github.event.inputs.target_environment == 'gamma' || (github.event.inputs.target_environment == '' && github.ref_name == 'v4/main')) && '-gamma' || '' }}
  UI_CDN_STACK_BASE: enceladus-ui-cdn

jobs:
  # ---------------------------------------------------------------------------
  # BUILD — env-agnostic. No AWS, no environment gate. Produces dist/ artifact.
  # VITE_API_BASE=/api/v1 is injected at build so the PWA's fetches are
  # same-origin (the /api/* CloudFront behavior from 07-ui-cdn proxies them to
  # API Gateway with auth cookies intact).
  # ---------------------------------------------------------------------------
  build:
    name: Build ui-v2 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/ui-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/ui-v2/package-lock.json

      # DVP-TSK-860: @io-kit/shell + tokens come from CodeArtifact (R13 inline pattern).
      # The 900s read token feeds `npm ci` via frontend/ui-v2/.npmrc.
      - name: Configure AWS credentials (OIDC io-kit read role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356364570033:role/io-kit-github-read
          aws-region: us-west-2

      - name: CodeArtifact token for @io-kit
        run: |
          set -euo pipefail
          T=$(aws codeartifact get-authorization-token --domain io --domain-owner 356364570033 --duration-seconds 900 --query authorizationToken --output text)
          echo "::add-mask::$T"
          echo "CODEARTIFACT_AUTH_TOKEN=$T" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Resolve AppSync realtime config for the target plane
        # ENC-TSK-K70 / DVP-TSK-928 (io ruling E41-R2). The AppSync Events values are GitHub repo VARIABLES (not
        # CFN describe-stacks) because this build job is deliberately credential-less and ungated: granting it AWS
        # access, or attaching a GitHub Environment (which would make a prod build wait for io a SECOND time on top
        # of the deploy job's own gate), would weaken the FTR-120 gating model. So the two planes use two variable
        # sets, selected here by the same plane rule as VITE_OAUTH_REDIRECT_URI and the deploy job:
        #   gamma (target_environment=gamma, or v4/main with no override):
        #     VITE_APPSYNC_HTTP_HOST, VITE_APPSYNC_REALTIME_HOST, VITE_APPSYNC_API_KEY, VITE_APPSYNC_AUTHED_NAMESPACE
        #   production (everything else):
        #     VITE_APPSYNC_HTTP_HOST_PROD, VITE_APPSYNC_REALTIME_HOST_PROD, VITE_APPSYNC_AUTHED_NAMESPACE_PROD
        # Production is Cognito-only: its API key is forced EMPTY here, whatever repo variables hold, so a prod
        # bundle can never carry (or fall back to) an API key. Selection is done in shell, not with `a && b || c`
        # expressions, because an unset variable is '' (falsy) and would silently fall through to the OTHER plane's
        # value. Empty hosts => appsyncConfig.ts disables realtime (S3-snapshot degrade), by construction.
        env:
          TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment }}
          REF_NAME: ${{ github.ref_name }}
          GAMMA_HTTP_HOST: ${{ vars.VITE_APPSYNC_HTTP_HOST }}
          GAMMA_REALTIME_HOST: ${{ vars.VITE_APPSYNC_REALTIME_HOST }}
          GAMMA_API_KEY: ${{ vars.VITE_APPSYNC_API_KEY }}
          GAMMA_AUTHED_NAMESPACE: ${{ vars.VITE_APPSYNC_AUTHED_NAMESPACE }}
          PROD_HTTP_HOST: ${{ vars.VITE_APPSYNC_HTTP_HOST_PROD }}
          PROD_REALTIME_HOST: ${{ vars.VITE_APPSYNC_REALTIME_HOST_PROD }}
          PROD_AUTHED_NAMESPACE: ${{ vars.VITE_APPSYNC_AUTHED_NAMESPACE_PROD }}
        run: |
          set -euo pipefail
          if [ "${TARGET_ENVIRONMENT}" = "gamma" ] || { [ -z "${TARGET_ENVIRONMENT}" ] && [ "${REF_NAME}" = "v4/main" ]; }; then
            plane=gamma
            {
              echo "VITE_APPSYNC_HTTP_HOST=${GAMMA_HTTP_HOST}"
              echo "VITE_APPSYNC_REALTIME_HOST=${GAMMA_REALTIME_HOST}"
              echo "VITE_APPSYNC_API_KEY=${GAMMA_API_KEY}"
              echo "VITE_APPSYNC_AUTHED_NAMESPACE=${GAMMA_AUTHED_NAMESPACE}"
            } >> "${GITHUB_ENV}"
          else
            plane=production
            {
              echo "VITE_APPSYNC_HTTP_HOST=${PROD_HTTP_HOST}"
              echo "VITE_APPSYNC_REALTIME_HOST=${PROD_REALTIME_HOST}"
              echo "VITE_APPSYNC_API_KEY="
              echo "VITE_APPSYNC_AUTHED_NAMESPACE=${PROD_AUTHED_NAMESPACE}"
            } >> "${GITHUB_ENV}"
          fi
          echo "AppSync realtime config resolved for plane=${plane}"

      - name: Build
        env:
          # Same-origin API base (07-ui-cdn /api/* behavior proxies to API GW).
          VITE_API_BASE: /api/v1
          # ENC-TSK-K98: cold-start snapshot now comes from the AUTHENTICATED
          # feed_query API (GET /api/v1/feed/tasks.json), not the public
          # /mobile/v1/ S3 objects (which are being retired). Same-origin;
          # the 07-ui-cdn /api/* behavior proxies to API GW.
          VITE_FEED_BASE_URL: /api/v1/feed
          # VITE_APPSYNC_{HTTP_HOST,REALTIME_HOST,API_KEY,AUTHED_NAMESPACE} come from the previous step
          # ("Resolve AppSync realtime config for the target plane") via GITHUB_ENV.
          VITE_APPSYNC_REGION: us-west-2
          # ENC-TSK-P51: OAuth redirect baked per resolved plane. The callback
          # must be same-origin with the viewer (auth_refresh sets the session
          # cookies on the callback host). Prod -> enceladus.jreese.net (io
          # ruling on P51); gamma/feature builds get '' and fall back to the
          # gamma default inside authConfig.ts. Must stay byte-identical to
          # auth_refresh's WEBUI_OAUTH_REDIRECT_URI and a registered Cognito
          # callback (ENC-ISS-124/125 redirect_mismatch class).
          #
          # ENC-TSK-P53: the gamma-first form `cond && '' || prod` can never
          # yield '' — GitHub expressions treat '' as falsy, so the || branch
          # always won and EVERY build (gamma included) baked the prod
          # callback; gamma logins then landed on prod. The condition below is
          # the exact negation of ENVIRONMENT_SUFFIX's, putting the non-empty
          # value in the && branch (same reason SUFFIX is written gamma-first).
          VITE_OAUTH_REDIRECT_URI: ${{ (github.event.inputs.target_environment != 'gamma' && (github.event.inputs.target_environment != '' || github.ref_name != 'v4/main')) && 'https://enceladus.jreese.net/api/v1/auth/callback' || '' }}
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-v2-dist-${{ github.sha }}
          path: frontend/ui-v2/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # PUBLISH SKIPPED — feature-branch v4/** pushes build but never mutate gamma
  # (ENC-TSK-M89). Surfaces intentional skip in the Actions UI / summary.
  # ---------------------------------------------------------------------------
  publish_skipped:
    name: Publish skipped (not v4/main)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v4/') && github.ref_name != 'v4/main'
    runs-on: ubuntu-latest
    steps:
      - name: Log build-only branch policy
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::notice::ENC-TSK-M89 build-only — branch '${REF_NAME}' does not publish to gamma. Merge to v4/main to deploy."
          {
            echo "## UI publish skipped — ${REF_NAME}"
            echo ""
            echo "This workflow built \`frontend/ui-v2\` but **did not deploy** because only \`v4/main\` pushes publish to gamma."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # DEPLOY — environment-scoped, AWS-mutating. The ONLY gated job.
  # ENC-FTR-120: v3-prod carries a required-reviewer rule (io); v4-gamma none.
  # ENC-TSK-M89: gamma publish is v4/main-only; main retains the io-gated prod lane.
  # ---------------------------------------------------------------------------
  deploy:
    # ENC-TSK-P52: plane resolved from target_environment first, ref second
    # (P40 pattern) — a v4/main dispatch with target_environment=production
    # deploys prod behind the v3-prod gate instead of silently going to gamma.
    name: Deploy ui-v2 -> ${{ (github.event.inputs.target_environment == 'gamma' || (github.event.inputs.target_environment == '' && github.ref_name == 'v4/main')) && 'v4-gamma' || 'v3-prod' }}
    needs: build
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref_name == 'v4/main' || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ (github.event.inputs.target_environment == 'gamma' || (github.event.inputs.target_environment == '' && github.ref_name == 'v4/main')) && 'v4-gamma' || 'v3-prod' }}
    outputs:
      bucket: ${{ steps.resolve.outputs.bucket }}
      distribution_id: ${{ steps.resolve.outputs.distribution_id }}
      stack_name: ${{ steps.resolve.outputs.stack_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-v2-dist-${{ github.sha }}
          path: frontend/ui-v2/dist

      - name: Select UI-deploy role
        id: role
        env:
          # Prefer a dedicated least-privilege UI-deploy role; fall back to the
          # privileged CFN role (which must carry the s3:*/cloudfront perms
          # documented in the file header) when the dedicated one is unset.
          UI_ROLE: ${{ secrets.AWS_UI_DEPLOY_ROLE_TO_ASSUME }}
          CFN_ROLE: ${{ secrets.AWS_CLOUDFORMATION_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          if [ -n "${UI_ROLE}" ]; then
            echo "role_arn=${UI_ROLE}" >> "${GITHUB_OUTPUT}"
            echo "Using dedicated AWS_UI_DEPLOY_ROLE_TO_ASSUME."
          elif [ -n "${CFN_ROLE}" ]; then
            echo "role_arn=${CFN_ROLE}" >> "${GITHUB_OUTPUT}"
            echo "::warning::AWS_UI_DEPLOY_ROLE_TO_ASSUME unset — falling back to AWS_CLOUDFORMATION_ROLE_TO_ASSUME. It needs s3:PutObject/DeleteObject/ListBucket/GetObject on the UI bucket + cloudformation:DescribeStacks."
          else
            echo "::error::Neither AWS_UI_DEPLOY_ROLE_TO_ASSUME nor AWS_CLOUDFORMATION_ROLE_TO_ASSUME is set. Cannot assume an AWS role for the UI deploy."
            exit 1
          fi

      - name: Configure AWS credentials (environment-scoped OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve bucket + distribution from T1 stack exports
        id: resolve
        run: |
          set -euo pipefail
          STACK="${UI_CDN_STACK_BASE}${ENVIRONMENT_SUFFIX}"
          echo "Resolving UI CDN outputs from stack: ${STACK} (region ${AWS_REGION})"

          # describe-stacks errors (non-zero) if the stack does not exist yet.
          if ! aws cloudformation describe-stacks \
                --stack-name "${STACK}" \
                --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "::error::UI CDN stack not deployed yet: '${STACK}' does not exist in ${AWS_REGION}. Apply T1 (cloudformation-ui-cdn-stack-deploy.yml) before deploying the UI."
            exit 1
          fi

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK}" --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='UiBucketName'].OutputValue" \
            --output text)
          DIST=$(aws cloudformation describe-stacks \
            --stack-name "${STACK}" --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='UiDistributionId'].OutputValue" \
            --output text)

          # describe-stacks returns empty/None for a missing output key even when
          # the stack exists (e.g. an older stack revision) — fail loud rather
          # than sync into an empty bucket name.
          if [ -z "${BUCKET}" ] || [ "${BUCKET}" = "None" ] || \
             [ -z "${DIST}" ] || [ "${DIST}" = "None" ]; then
            echo "::error::UI CDN stack '${STACK}' exists but is missing UiBucketName/UiDistributionId outputs (bucket='${BUCKET}' dist='${DIST}'). Is T1 fully applied?"
            exit 1
          fi

          echo "stack_name=${STACK}"        >> "${GITHUB_OUTPUT}"
          echo "bucket=${BUCKET}"           >> "${GITHUB_OUTPUT}"
          echo "distribution_id=${DIST}"    >> "${GITHUB_OUTPUT}"
          echo "Resolved bucket=${BUCKET}  distribution=${DIST}"

      - name: Sync build to S3 (cache-control split)
        id: sync
        env:
          BUCKET: ${{ steps.resolve.outputs.bucket }}
        run: |
          set -euo pipefail
          DIST_DIR=frontend/ui-v2/dist
          [ -d "${DIST_DIR}" ] || { echo "::error::${DIST_DIR} missing — build artifact not downloaded."; exit 1; }

          EXPECTED_ENTRY=$(grep -oE '/assets/index-[^" ]+\.js' "${DIST_DIR}/index.html" | head -1 || true)
          if [ -z "${EXPECTED_ENTRY}" ]; then
            echo "::error::Could not parse content-hashed entry bundle from ${DIST_DIR}/index.html."
            exit 1
          fi
          echo "expected_entry=${EXPECTED_ENTRY}" >> "${GITHUB_OUTPUT}"
          echo "Expected viewer entry bundle: ${EXPECTED_ENTRY}"

          # ENC-TSK-R37 (C3.4, BRD FR-35): two cache classes, no CloudFront
          # invalidation.
          #   IMMUTABLE — content-addressed files whose name changes with their
          #     bytes: everything Vite emits under assets/ ([name]-[hash]) and
          #     the vite-plugin-pwa workbox runtime (workbox-[hash].js, at the
          #     bucket root). Safe to cache for a year.
          #   NOCACHE   — everything else: index.html (and any other *.html),
          #     the service worker (sw.js), the manifest, and the un-hashed
          #     root scripts the worker importScripts() (notify-sw.js,
          #     sw-feed-cache-cleanup.js), icons, favicons. A stale copy of any
          #     of these pins a client to an old asset graph, so the origin
          #     tells every cache (browser + CloudFront, CachingOptimized
          #     honors origin Cache-Control above its 1s MinTTL) to revalidate.
          IMMUTABLE_CC="public,max-age=31536000,immutable"
          NOCACHE_CC="public,max-age=0,must-revalidate"

          # NOTE: `aws s3 sync` SKIPS objects whose size is unchanged and whose
          # destination is newer than the source, and never rewrites metadata
          # on a skipped object. The former full-sync-then-immutable-re-sync
          # ordering therefore left hashed assets with the first pass's
          # no-cache header. Each class is now uploaded exactly once, with its
          # own header, in a pass that selects only that class.

          # 1. Immutable class (hashed assets + hashed workbox runtime).
          aws s3 sync "${DIST_DIR}/" "s3://${BUCKET}/" \
            --exclude "*" \
            --include "assets/*" \
            --include "workbox-*.js" \
            --cache-control "${IMMUTABLE_CC}"

          # 2. Revalidating class: everything else. ENC-TSK-K69: mobile/* is
          #    EXCLUDED — the gamma feed publisher (devops-feed-publisher-gamma)
          #    writes the /mobile/v1 snapshot JSON into this bucket for
          #    same-origin serving; a UI deploy must never touch or wipe it.
          aws s3 sync "${DIST_DIR}/" "s3://${BUCKET}/" \
            --exclude "mobile/*" \
            --exclude "assets/*" \
            --exclude "workbox-*.js" \
            --cache-control "${NOCACHE_CC}"

          # 3. Authoritative re-put of the app shell + service worker so their
          #    header never depends on sync skip semantics (a stale index.html
          #    or sw.js would pin the browser to an old asset graph). Covers
          #    every root-level *.html in addition to the named files; skips
          #    anything a given build did not emit.
          SHELL_FILES="sw.js manifest.webmanifest notify-sw.js sw-feed-cache-cleanup.js registerSW.js"
          for f in $(cd "${DIST_DIR}" && ls -1 *.html 2>/dev/null) ${SHELL_FILES}; do
            if [ -f "${DIST_DIR}/${f}" ]; then
              aws s3 cp "${DIST_DIR}/${f}" "s3://${BUCKET}/${f}" \
                --cache-control "${NOCACHE_CC}" \
                --metadata-directive REPLACE
            else
              echo "note: ${f} not present in build output — skipping no-cache re-put."
            fi
          done

          # 4. Mirror deletions only (stale objects from earlier builds).
          #    --size-only: every local file was already uploaded above, so
          #    this pass must NOT re-upload anything (it would stamp the wrong
          #    header on assets if a clock skew made sync think a file was
          #    newer). mobile/* stays excluded from the delete-mirror.
          aws s3 sync "${DIST_DIR}/" "s3://${BUCKET}/" --delete --size-only \
            --exclude "mobile/*" \
            --cache-control "${NOCACHE_CC}"

      - name: Gate on viewer path (zero-invalidation proof, ENC-TSK-R37)
        id: viewer_gate
        env:
          STACK: ${{ steps.resolve.outputs.stack_name }}
          EXPECTED_ENTRY: ${{ steps.sync.outputs.expected_entry }}
        run: |
          set -euo pipefail
          DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK}" --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='UiDistributionDomainName'].OutputValue" \
            --output text)
          if [ -z "${DOMAIN}" ] || [ "${DOMAIN}" = "None" ]; then
            echo "::error::UI CDN stack '${STACK}' is missing UiDistributionDomainName — cannot gate on viewer path."
            exit 1
          fi

          # No CloudFront invalidation is issued (ENC-TSK-R37). index.html is
          # revalidating at the origin and the CachingOptimized policy honors
          # it (MinTTL 1s), so the edge converges within seconds. This gate is
          # the proof: it must observe the new entry bundle on the viewer path
          # without any purge. A timeout here means the origin/edge cache
          # headers regressed, not that an invalidation is missing.
          # Caveat: this gates the *.cloudfront.net domain. A Cloudflare proxy
          # in front of the custom hostname is not exercised by this check.
          MAX_ATTEMPTS=36
          SLEEP_SEC=5
          echo "No invalidation; gating on viewer index.html referencing ${EXPECTED_ENTRY} (ENC-TSK-M88 / ENC-TSK-R37)."
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            INDEX_BODY=$(curl -sS "https://${DOMAIN}/index.html" || true)
            VIEWER_ENTRY=$(echo "${INDEX_BODY}" | grep -oE '/assets/index-[^" ]+\.js' | head -1 || true)
            if [ "${VIEWER_ENTRY}" = "${EXPECTED_ENTRY}" ]; then
              ENTRY_CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}${EXPECTED_ENTRY}" || true)
              if [ "${ENTRY_CODE}" = "200" ]; then
                echo "Viewer path gate PASS: index.html references ${EXPECTED_ENTRY} (HTTP ${ENTRY_CODE}) after ${attempt} attempt(s), no invalidation."
                exit 0
              fi
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: index.html fresh but entry bundle returned ${ENTRY_CODE}; sleeping ${SLEEP_SEC}s..."
            else
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: viewer entry '${VIEWER_ENTRY:-(missing)}' != expected '${EXPECTED_ENTRY}'; sleeping ${SLEEP_SEC}s..."
            fi
            sleep "${SLEEP_SEC}"
          done
          echo "::error::Viewer path gate FAIL: https://${DOMAIN}/index.html did not reference ${EXPECTED_ENTRY} within $((MAX_ATTEMPTS * SLEEP_SEC))s with no invalidation. Check the Cache-Control on index.html at the S3 origin and the distribution's cache policy."
          exit 1

      # Post-deploy smoke test against the live distribution. Proves three
      # things end-to-end: (1) the app shell serves 200 text/html from the S3
      # origin, (2) /api/* routes to the API-Gateway origin (a 401 from the
      # unauthenticated /api/v1/projects means the behavior reaches API GW and
      # Cognito auth is enforced — a 200 would mean auth is OFF; a 404/000 means
      # /api/* routing is broken). Health is a soft check (warning only). The
      # resolved DOMAIN is echoed as LIVE_UI_URL= so it is greppable in the log.
      - name: Validate live distribution (shell + /api routing)
        env:
          STACK: ${{ steps.resolve.outputs.stack_name }}
          EXPECTED_ENTRY: ${{ steps.sync.outputs.expected_entry }}
        run: |
          set -euo pipefail
          DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK}" --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='UiDistributionDomainName'].OutputValue" \
            --output text)
          if [ -z "${DOMAIN}" ] || [ "${DOMAIN}" = "None" ]; then
            echo "::error::UI CDN stack '${STACK}' is missing the UiDistributionDomainName output — cannot validate the live distribution."
            exit 1
          fi
          echo "LIVE_UI_URL=https://${DOMAIN}/"
          echo "Viewer path gate passed (no CloudFront invalidation, ENC-TSK-R37)"

          # Capture each result defensively so a curl failure surfaces as a
          # 000 code under set -e rather than aborting the step early.
          SHELL_RESULT=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "https://${DOMAIN}/" || true)
          SHELL_CODE=$(echo "${SHELL_RESULT}" | awk '{print $1}')
          SHELL_CT=$(echo "${SHELL_RESULT}" | awk '{print $2}')
          HEALTH=$(curl -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/api/v1/health" || true)
          PROJ=$(curl -sS -o /dev/null -w '%{http_code}' "https://${DOMAIN}/api/v1/projects" || true)

          # Evaluate expectations.
          shell_ok="FAIL"; [ "${SHELL_CODE}" = "200" ] && case "${SHELL_CT}" in text/html*) shell_ok="PASS";; esac
          health_ok="WARN"; [ "${HEALTH}" = "200" ] && health_ok="PASS"
          proj_ok="FAIL";  [ "${PROJ}" = "401" ] && proj_ok="PASS"

          # ENC-TSK-M88: prove the viewer path serves the build we just shipped.
          INDEX_HEADERS=$(curl -sSI "https://${DOMAIN}/index.html" || true)
          INDEX_CACHE=$(echo "${INDEX_HEADERS}" | awk -F': ' 'tolower($1)=="cache-control"{print $2; exit}')
          INDEX_BODY=$(curl -sS "https://${DOMAIN}/index.html" || true)
          VIEWER_ENTRY=$(echo "${INDEX_BODY}" | grep -oE '/assets/index-[^" ]+\.js' | head -1 || true)
          version_ok="FAIL"
          if [ "${VIEWER_ENTRY}" = "${EXPECTED_ENTRY}" ]; then
            version_ok="PASS"
          fi
          cache_ok="FAIL"
          case "${INDEX_CACHE}" in
            *no-cache*|*max-age=0*) cache_ok="PASS" ;;
          esac
          # ENC-TSK-R37: the hashed entry bundle must be immutable and the
          # service worker must revalidate (a cached sw.js blocks app updates).
          ENTRY_CACHE=$(curl -sSI "https://${DOMAIN}${EXPECTED_ENTRY}" | awk -F': ' 'tolower($1)=="cache-control"{print $2; exit}' | tr -d '\r' || true)
          immutable_ok="FAIL"
          case "${ENTRY_CACHE}" in
            *max-age=31536000*immutable*) immutable_ok="PASS" ;;
          esac
          SW_CACHE="n/a"; sw_ok="PASS"
          if [ -f frontend/ui-v2/dist/sw.js ]; then
            SW_CACHE=$(curl -sSI "https://${DOMAIN}/sw.js" | awk -F': ' 'tolower($1)=="cache-control"{print $2; exit}' | tr -d '\r' || true)
            sw_ok="FAIL"
            case "${SW_CACHE}" in
              *no-cache*|*max-age=0*) sw_ok="PASS" ;;
            esac
          fi

          {
            echo "## UI live-distribution validation — ${STACK}"
            echo ""
            echo "LIVE_UI_URL: https://${DOMAIN}/"
            echo ""
            echo "| Check | Endpoint | Result | Expected | Status |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| Shell | \`/\` | \`${SHELL_CODE} ${SHELL_CT}\` | 200 + text/html | ${shell_ok} |"
            echo "| Viewer build | \`/index.html\` entry | \`${VIEWER_ENTRY:-(missing)}\` | \`${EXPECTED_ENTRY}\` | ${version_ok} |"
            echo "| App-shell cache | \`/index.html\` | \`${INDEX_CACHE:-(missing)}\` | no-cache / max-age=0 | ${cache_ok} |"
            echo "| Hashed-asset cache | entry bundle | \`${ENTRY_CACHE:-(missing)}\` | max-age=31536000, immutable | ${immutable_ok} |"
            echo "| Service-worker cache | \`/sw.js\` | \`${SW_CACHE:-(missing)}\` | no-cache / max-age=0 | ${sw_ok} |"
            echo "| Health | \`/api/v1/health\` | \`${HEALTH}\` | 200 | ${health_ok} |"
            echo "| API routing/auth | \`/api/v1/projects\` | \`${PROJ}\` | 401 (auth enforced) | ${proj_ok} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "Shell:  ${SHELL_CODE} ${SHELL_CT}  -> ${shell_ok}"
          echo "Health: ${HEALTH}  -> ${health_ok}"
          echo "API:    ${PROJ}  -> ${proj_ok}"

          # FAIL conditions: shell not 200/text/html, OR /api/v1/projects not 401
          # (200 = auth not enforced; 404/000 = /api/* routing broken). A
          # non-200 health is only a warning and never fails the step.
          fatal=0
          if [ "${shell_ok}" != "PASS" ]; then
            echo "::error::App shell did not return 200 text/html (got '${SHELL_CODE} ${SHELL_CT}') at https://${DOMAIN}/"
            fatal=1
          fi
          if [ "${proj_ok}" != "PASS" ]; then
            echo "::error::/api/v1/projects returned '${PROJ}', expected 401. A 200 means Cognito auth is not enforced; a 404/000 means the /api/* behavior is not routing to the API-Gateway origin."
            fatal=1
          fi
          if [ "${version_ok}" != "PASS" ]; then
            echo "::error::Viewer path /index.html entry '${VIEWER_ENTRY:-(missing)}' != expected '${EXPECTED_ENTRY}' — the edge may still be serving a stale app shell (no invalidation is issued; check origin Cache-Control)."
            fatal=1
          fi
          if [ "${cache_ok}" != "PASS" ]; then
            echo "::error::Viewer path /index.html Cache-Control '${INDEX_CACHE:-(missing)}' is not no-cache/max-age=0."
            fatal=1
          fi
          if [ "${immutable_ok}" != "PASS" ]; then
            echo "::error::Entry bundle ${EXPECTED_ENTRY} Cache-Control '${ENTRY_CACHE:-(missing)}' is not max-age=31536000,immutable."
            fatal=1
          fi
          if [ "${sw_ok}" != "PASS" ]; then
            echo "::error::Viewer path /sw.js Cache-Control '${SW_CACHE:-(missing)}' is not no-cache/max-age=0."
            fatal=1
          fi
          if [ "${health_ok}" != "PASS" ]; then
            echo "::warning::/api/v1/health returned '${HEALTH}' (expected 200) — non-fatal warning."
          fi
          if [ "${fatal}" -ne 0 ]; then
            echo "Live-distribution validation: FAIL"
            exit 1
          fi
          echo "Live-distribution validation: PASS"

  # ---------------------------------------------------------------------------
  # RECORD_DEPLOY — write a DPL record so deploy.history stays current
  # (ENC-ISS-451 mechanism, mirrored from _deploy.yml). Only runs after a
  # successful deploy. continue-on-error: telemetry MUST NEVER block the deploy.
  # ---------------------------------------------------------------------------
  record_deploy:
    name: Record deploy -> DPL (ENC-ISS-451)
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'success' && github.event_name == 'push' && github.ref_name == 'v4/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5

    steps:
      - name: Fetch current governance hash
        id: govhash
        env:
          COORDINATION_INTERNAL_API_KEY: ${{ secrets.COORDINATION_INTERNAL_API_KEY }}
        run: |
          HASH=$(curl -sf \
            -H "X-Coordination-Internal-Key: ${COORDINATION_INTERNAL_API_KEY}" \
            -H "Accept: application/json" \
            "https://enceladus.jreese.net/api/v1/health" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('governance_hash',''))" 2>/dev/null || true)
          echo "governance_hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Governance hash: ${HASH:-(fetch failed)}"

      - name: Extract PR number for merge commit
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.DM_GITHUB_READ_TOKEN || github.token }}
          COMMIT_SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PR_NUMBER=$(gh api "/repos/$GITHUB_REPOSITORY/commits/${COMMIT_SHA}/pulls" \
            --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            MSG="$HEAD_COMMIT_MESSAGE"
            PR_NUMBER=$(echo "$MSG" | grep -oE '(^Merge pull request #|#)[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          fi
          echo "pr_number=${PR_NUMBER:-0}" >> "$GITHUB_OUTPUT"
          echo "PR number: ${PR_NUMBER:-(not found, using 0)}"

      - name: Submit DPL deploy record
        id: submit
        env:
          COORDINATION_INTERNAL_API_KEY: ${{ secrets.COORDINATION_INTERNAL_API_KEY }}
          GOVERNANCE_HASH: ${{ steps.govhash.outputs.governance_hash }}
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          COMMIT_SHA: ${{ github.sha }}
          # v4/main -> v4-gamma only (ENC-TSK-M89 — feature branches never record).
          ENVIRONMENT: v4-gamma
          MERGED_AT: ${{ github.event.head_commit.timestamp }}
          DISTRIBUTION_ID: ${{ needs.deploy.outputs.distribution_id }}
          BUCKET: ${{ needs.deploy.outputs.bucket }}
          STACK_NAME: ${{ needs.deploy.outputs.stack_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          BODY=$(python3 - <<'PY'
          import json, os
          pr_raw = os.environ.get('PR_NUMBER', '0')
          pr_id = int(pr_raw) if pr_raw.isdigit() else 0
          sha = os.environ['COMMIT_SHA']
          env = os.environ['ENVIRONMENT']
          dist = os.environ.get('DISTRIBUTION_ID', '')
          bucket = os.environ.get('BUCKET', '')
          stack = os.environ.get('STACK_NAME', '')
          ref = os.environ.get('REF_NAME', '')
          acct = "356364570033"
          print(json.dumps({
              "project_id": "enceladus",
              "change_type": "patch",
              # ENC-ISS-451: "ui_update" is not a member of VALID_DEPLOYMENT_TYPES
              # in backend/lambda/deploy_intake (every submission 400s). This is
              # also deploy_intake's own default deployment_type for exactly this
              # case (a UI deploy) -- picking it means the non_ui_config block
              # below stays inert (github_public_static is not in
              # NON_UI_SERVICE_GROUP_BY_TYPE, so no service_group/target_arn
              # validation applies), so no other field needs to change.
              "deployment_type": "github_public_static",
              "summary": f"ui-v2 PWA deploy to {env} @ {sha[:7]} (PR #{pr_id})",
              "changes": [
                  f"commit_sha: {sha}",
                  f"branch: {ref}",
                  f"environment: {env}",
                  f"bucket: {bucket}",
                  f"distribution_id: {dist}",
                  f"stack: {stack}",
                  "workflow: _ui_deploy.yml / Deploy UI (ui-v2 PWA)",
              ],
              "pr_id": pr_id,
              "merged_at": os.environ['MERGED_AT'],
              "pr_owner": "NX-2021-L",
              "pr_repo": "enceladus",
              "submitted_by": "gha-ui-deploy-pipeline",
              "non_ui_config": {
                  "service_group": "ui",
                  # The CloudFront distribution is the UI deploy target.
                  "target_arn": f"arn:aws:cloudfront::{acct}:distribution/{dist}",
              },
              "governance_hash": os.environ['GOVERNANCE_HASH'],
          }))
          PY
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "X-Coordination-Internal-Key: ${COORDINATION_INTERNAL_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$BODY" \
            "https://8nkzqkmxqc.execute-api.us-west-2.amazonaws.com/api/v1/deploy/submit")

          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          echo "Response (HTTP $HTTP_CODE): $HTTP_BODY"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            DEPLOY_ID=$(echo "$HTTP_BODY" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('deploy_id') or d.get('request_id') or d.get('spec_id') or 'unknown')" \
              2>/dev/null || echo "unknown")
            echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
            echo "DPL record written: ${DEPLOY_ID}"
          else
            echo "deploy_id=failed-http-${HTTP_CODE}" >> "$GITHUB_OUTPUT"
            echo "DPL record submit failed (HTTP ${HTTP_CODE}) — deploy succeeded, telemetry gap only"
            exit 1
          fi
