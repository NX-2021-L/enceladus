name: CloudFormation AppSync Events Stack Deploy

# ENC-TSK-M56 — AppSync Events real-time layer (06-appsync-events.yaml) had NO
# CI/CD deploy lane at all (the template's own Metadata.EscalatedResidualSteps
# documented it as privileged-terminal/manual-only). That gap is why its API
# key silently hit AppSync's 7-day default expiration with nobody re-running
# a deploy to renew it — gamma's entire realtime transport returned 401
# UnauthorizedException on every connection_init as a result.
#
# DVP-TSK-928 (io ruling E41-R2): the stack now deploys to BOTH planes, the same
# shape as the other CFN lanes (cloudformation-monitoring-stack-deploy.yml):
#   * v4/** push (or target_environment=gamma)  -> stack enceladus-appsync-events-gamma,
#     apply in the v4-gamma Environment (no reviewer).
#   * main push (or target_environment=production) -> stack enceladus-appsync-events,
#     apply in the v3-prod Environment (required reviewer: io). A prod-targeted run
#     therefore PAUSES at the apply job as a reviewable, rejectable request.
# The production plane is Cognito-only: it has no ApiKey resource, so the key
# renewal below is gamma-only and the monthly schedule is pinned to gamma.
#
# Plan/apply split (ENC-TSK-J62/J63 pattern). Change-set creation uses
# `aws cloudformation deploy --no-execute-changeset`, which preserves the
# parameter-override semantics: a parameter that is NOT listed reuses the stack's
# stored value (UsePreviousValue) while a parameter that is new to the stack takes
# its template Default. The Cognito parameters added by DVP-TSK-928 are therefore
# deliberately not overridden here; DataStackName and Environment are passed
# explicitly so the two planes can never inherit each other's value.

on:
  push:
    branches:
      - main
      - 'v4/**'
    paths:
      - "infrastructure/cloudformation/06-appsync-events.yaml"
      - ".github/workflows/cloudformation-appsync-events-stack-deploy.yml"
  schedule:
    # Monthly gamma API-key renewal — comfortably inside AppSync's 365-day max, well
    # short of ever approaching another expiration-driven outage. Gamma only.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      stack_name:
        description: "CloudFormation stack name for 06-appsync-events template (the -gamma suffix is appended on the gamma plane)"
        type: string
        required: false
        default: "enceladus-appsync-events"
      # Same P40/P54 pattern as the monitoring lane: empty keeps the ref-derived
      # routing (push and schedule events never supply it); 'production' targets the
      # prod stack from a trusted v4 ref, with the apply still pausing at the v3-prod gate.
      target_environment:
        description: "Override the target plane (empty = derive from ref). 'production' pauses at the v3-prod required-reviewer gate before applying."
        type: choice
        required: false
        default: ""
        options: ["", "gamma", "production"]
      reason:
        description: "Why this deploy is being triggered"
        type: string
        required: false
        default: "manual appsync-events stack deploy"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudformation-appsync-events-stack-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  TEMPLATE_FILE: infrastructure/cloudformation/06-appsync-events.yaml
  # Gamma-first on purpose (GitHub Actions treats '' as falsy): the schedule, an explicit
  # 'gamma' input, or (no input) a v4/** ref resolve to '-gamma'; an explicit 'production'
  # input or a main-ref event resolve to '' (prod). Mirrors the monitoring lane.
  ENVIRONMENT_SUFFIX: ${{ (github.event_name == 'schedule' || github.event.inputs.target_environment == 'gamma' || (github.event.inputs.target_environment == '' && startsWith(github.ref, 'refs/heads/v4/'))) && '-gamma' || '' }}
  DEFAULT_STACK_NAME: enceladus-appsync-events

jobs:
  plan:
    name: Plan AppSync Events stack change-set
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      stack_name: ${{ steps.params.outputs.stack_name }}
      has_changes: ${{ steps.changeset.outputs.has_changes }}
      changeset_arn: ${{ steps.changeset.outputs.changeset_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC CloudFormation role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLOUDFORMATION_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve deployment parameters
        id: params
        run: |
          set -euo pipefail
          stack_name="${{ github.event.inputs.stack_name || env.DEFAULT_STACK_NAME }}${ENVIRONMENT_SUFFIX}"
          echo "stack_name=${stack_name}" >> "${GITHUB_OUTPUT}"
          if [ "${ENVIRONMENT_SUFFIX}" = "-gamma" ]; then
            plane=gamma
            # 364 days: one day inside AppSync's 365-day hard max, hour-rounded
            # by AppSync itself regardless of the exact second we compute here.
            expires_epoch=$(date -u -d '+364 days' +%s)
            echo "Computed ApiKeyExpiresEpoch=${expires_epoch} ($(date -u -d "@${expires_epoch}"))"
          else
            plane=production
            # Production has no ApiKey resource (Cognito-only): nothing to renew.
            expires_epoch=""
          fi
          echo "plane=${plane}" >> "${GITHUB_OUTPUT}"
          echo "expires_epoch=${expires_epoch}" >> "${GITHUB_OUTPUT}"
          echo "Plane=${plane} stack=${stack_name}"

      - name: Clean up ROLLBACK_COMPLETE stack if present (gamma self-heal)
        if: env.ENVIRONMENT_SUFFIX == '-gamma'
        run: |
          set -euo pipefail
          stack_name="${{ steps.params.outputs.stack_name }}"
          status=$(aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${stack_name}" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")
          if [ "${status}" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack ${stack_name} is in ROLLBACK_COMPLETE — deleting before redeploy (gamma self-heal)"
            aws cloudformation delete-stack \
              --region "${AWS_REGION}" \
              --stack-name "${stack_name}"
            aws cloudformation wait stack-delete-complete \
              --region "${AWS_REGION}" \
              --stack-name "${stack_name}"
            echo "Stack deleted successfully"
          fi

      - name: Create AppSync Events stack change-set (no execute)
        id: changeset
        run: |
          set -euo pipefail

          overrides=(
            "EnvironmentSuffix=${ENVIRONMENT_SUFFIX}"
            "Environment=${{ steps.params.outputs.plane }}"
            "DataStackName=enceladus-data${ENVIRONMENT_SUFFIX}"
          )
          if [ "${ENVIRONMENT_SUFFIX}" = "-gamma" ]; then
            overrides+=("ApiKeyExpiresEpoch=${{ steps.params.outputs.expires_epoch }}")
          fi

          aws cloudformation deploy \
            --region "${AWS_REGION}" \
            --stack-name "${{ steps.params.outputs.stack_name }}" \
            --template-file "${TEMPLATE_FILE}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --no-execute-changeset \
            --s3-bucket enceladus-cfn-staging-us-west-2 \
            --s3-prefix 06-appsync-events/ \
            --parameter-overrides "${overrides[@]}" 2>&1 | tee /tmp/plan.log

          if grep -q "No changes to deploy" /tmp/plan.log; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "changeset_arn=" >> "${GITHUB_OUTPUT}"
            {
              echo "## AppSync Events stack plan — ${{ steps.params.outputs.stack_name }}"
              echo "No changes to deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changeset_arn=$(grep -oE 'arn:aws:cloudformation:[^ "]*changeSet/[^ "]*' /tmp/plan.log | head -1)
          if [ -z "${changeset_arn}" ]; then
            echo "::error::Change-set creation output did not contain a change-set ARN."
            exit 1
          fi
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"
          echo "changeset_arn=${changeset_arn}" >> "${GITHUB_OUTPUT}"

      - name: Write change-set summary
        if: steps.changeset.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          {
            echo "## AppSync Events stack plan — ${{ steps.params.outputs.stack_name }} (${{ steps.params.outputs.plane }})"
            echo ""
            echo "Change-set: \`${{ steps.changeset.outputs.changeset_arn }}\`"
            echo ""
            echo '```'
            aws cloudformation describe-change-set \
              --region "${AWS_REGION}" \
              --change-set-name "${{ steps.changeset.outputs.changeset_arn }}" \
              --query 'Changes[].{Action:ResourceChange.Action,Resource:ResourceChange.LogicalResourceId,Type:ResourceChange.ResourceType,Replacement:ResourceChange.Replacement}' \
              --output table
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply AppSync Events stack change-set
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ENC-FTR-120: v3-prod carries a required-reviewer rule (io); v4-gamma has none. A prod-targeted
    # run therefore pauses here as a rejectable request. Gate on the RESOLVED plane (same expression
    # as ENVIRONMENT_SUFFIX above; the environment key cannot read env.*).
    environment: ${{ (github.event_name == 'schedule' || github.event.inputs.target_environment == 'gamma' || (github.event.inputs.target_environment == '' && startsWith(github.ref, 'refs/heads/v4/'))) && 'v4-gamma' || 'v3-prod' }}

    steps:
      - name: Configure AWS credentials (environment-scoped OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CLOUDFORMATION_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute reviewed change-set
        id: deploy
        run: |
          set -euo pipefail
          changeset_type=$(aws cloudformation describe-change-set \
            --region "${AWS_REGION}" \
            --change-set-name "${{ needs.plan.outputs.changeset_arn }}" \
            --query 'ChangeSetType' --output text 2>/dev/null || echo "UPDATE")
          aws cloudformation execute-change-set \
            --region "${AWS_REGION}" \
            --change-set-name "${{ needs.plan.outputs.changeset_arn }}"
          if [ "${changeset_type}" = "CREATE" ]; then
            aws cloudformation wait stack-create-complete \
              --region "${AWS_REGION}" \
              --stack-name "${{ needs.plan.outputs.stack_name }}"
          else
            aws cloudformation wait stack-update-complete \
              --region "${AWS_REGION}" \
              --stack-name "${{ needs.plan.outputs.stack_name }}"
          fi

      - name: Report stack events on failure
        if: failure() && steps.deploy.conclusion == 'failure'
        run: |
          echo "=== Stack events (last 20) ==="
          aws cloudformation describe-stack-events \
            --region "${AWS_REGION}" \
            --stack-name "${{ needs.plan.outputs.stack_name }}" \
            --query 'StackEvents[:20].{Time:Timestamp,Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
            --output table || echo "(describe-stack-events unavailable)"

      - name: Report deployed stack state and UI variable values
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${{ needs.plan.outputs.stack_name }}" \
            --query 'Stacks[0].{StackName:StackName,StackStatus:StackStatus,LastUpdatedTime:LastUpdatedTime}' \
            --output table
          # DVP-TSK-928: the values to copy into the GitHub variables _ui_deploy.yml bakes into ui-v2.
          {
            echo "## ui-v2 realtime variables — ${{ needs.plan.outputs.stack_name }}"
            echo '```'
            aws cloudformation describe-stacks \
              --region "${AWS_REGION}" \
              --stack-name "${{ needs.plan.outputs.stack_name }}" \
              --query 'Stacks[0].Outputs[?OutputKey==`FeedEventsHttpEndpoint` || OutputKey==`FeedEventsRealtimeEndpoint` || OutputKey==`FeedEventsAuthedNamespace`].[OutputKey,OutputValue]' \
              --output text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
