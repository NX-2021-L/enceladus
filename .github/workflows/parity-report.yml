name: Parity Report

# DVP-TSK-840 / DVP-TSK-862 (DVP-PLN-008 E1): UI parity for enceladus.jreese.net.
# Checks that every default-visible action in the enceladus MCP caps manifest
# is reachable from a ui-v2 route (io-kit parity). Blocking-with-ratchet: the
# job fails when `missing` rises above (or `covered` drops below)
# frontend/ui-v2/parity/baseline.json, and on invalid input. It never demands
# that coverage rise. Basis is flags-off plus the flags that are ON by default in
# prod (PARITY_FLAGS, below) in the baseline, the gate and the report alike, so all
# three agree.
#
# DVP-TSK-B35: PARITY_FLAGS = enable_escalation_primitive. That flag gates 4 MCP
# actions (escalation.get/.list/.request/.watch) that are live in prod (server.py
# ENABLE_ESCALATION_PRIMITIVE default=True) and that ui-v2 serves (bespoke /escalations
# for .list, generated form for the rest; see src/actions/registry.ts
# DEFAULT_ON_FLAGS), so a flags-off run left them outside the ratchet. The kit takes
# flags, not action names, so counting .list and .request means counting the whole
# flag: baseline 82 -> 86. Flags still OFF in prod (recipe, lesson, handoff, component,
# typed relationships) stay excluded; turning one on in prod adds it here and bumps
# the baseline in the same PR. Smaller than a per-action allow list (needs kit
# support) or editing caps.json (must stay equal to the server registry).
# Route-or-waiver: a PR that adds a registry action ships a route/map entry, a
# waiver in frontend/ui-v2/parity/waivers.yaml, or an explicit baseline bump
# (see CONTRIBUTING.md).
#
# Reads AWS only: assumes io-kit-github-read and fetches a 15 minute
# CodeArtifact read token. No deploy, no write. Classified inert in
# tools/prod_gate_baseline.json.
#
# routes.yaml and map.yaml are generated from src/routes/router.tsx and
# src/api/*.ts by frontend/ui-v2/parity/generate_parity.py and committed. The
# job regenerates them and warns when the committed copies were stale.
# Triggers cover both lanes: main (dispatch) and v4/main (gamma).

on:
  pull_request:
    branches: [main, v4/main]
  push:
    branches: [main, v4/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Parity (blocking-with-ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      PARITY_DIR: frontend/ui-v2/parity
      CAPS: tools/enceladus-mcp-server/parity/caps.json
      STACK: enceladus.jreese.net
      PARITY_FLAGS: enable_escalation_primitive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # DVP-TSK-976 (DVP-PLN-013 E4-W4.1): recipes parity. Replays every recorded run fixture under
      # backend/lambda/tracker_mutation/fixtures/recipes through recipe_run_service with a fake executor
      # and a fake hub (no network, no AWS, no agent) and fails the job on FAIL. Runs before the AWS
      # steps so it is independent of CodeArtifact; its lines join the job summary and the artifact.
      - name: Recipes parity (replay recorded runs)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recipes-parity
          rc=0
          python3 backend/lambda/tracker_mutation/recipe_replay.py backend/lambda/tracker_mutation/fixtures/recipes \
            --md recipes-parity/recipes-parity.md || rc=$?
          cat recipes-parity/recipes-parity.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356364570033:role/io-kit-github-read
          aws-region: us-west-2

      - name: Install @io-kit/parity (per-build CodeArtifact read token)
        shell: bash
        run: |
          set -euo pipefail
          T=$(aws codeartifact get-authorization-token --domain io --domain-owner 356364570033 --duration-seconds 900 --query authorizationToken --output text)
          echo "::add-mask::$T"
          E=https://io-356364570033.d.codeartifact.us-west-2.amazonaws.com/npm/io-kit/
          mkdir -p "$RUNNER_TEMP/iokit" && cd "$RUNNER_TEMP/iokit"
          printf '@io-kit:registry=%s\n//%s:_authToken=%s\n' "$E" "${E#https://}" "$T" > .npmrc
          npm init -y >/dev/null && npm install --no-audit --no-fund @io-kit/parity@0.1.1
          echo "$RUNNER_TEMP/iokit/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Generate manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I "$PARITY_DIR/generate_parity.py"
          if ! git diff --quiet -- "$PARITY_DIR"; then
            echo "::error::committed routes.yaml/map.yaml were stale; run python3 $PARITY_DIR/generate_parity.py and commit the result"
            git diff --stat -- "$PARITY_DIR"
            exit 1
          fi

      - name: Generator and route-or-waiver tests
        shell: bash
        run: python3 -I -m unittest discover -s "$PARITY_DIR/tests"

      - name: Parity (blocking-with-ratchet, default-on flags)
        shell: bash
        run: |
          set -euo pipefail
          io-kit parity validate "$CAPS" "$PARITY_DIR/routes.yaml" "$PARITY_DIR/baseline.json"
          A=(--caps "$CAPS" --routes "$PARITY_DIR/routes.yaml" --stack "$STACK"
             --mapping "$PARITY_DIR/map.yaml" --waivers "$PARITY_DIR/waivers.yaml"
             --flags "$PARITY_FLAGS")
          # --flags = the flags ON by default in prod (DVP-TSK-B35), same basis as baseline.json;
          # every other flag-gated action stays excluded
          io-kit parity report "${A[@]}" --format md --out parity-report || true
          cat parity-report/*.md >> "$GITHUB_STEP_SUMMARY" || true
          io-kit parity baseline check --baseline "$PARITY_DIR/baseline.json" "${A[@]}" \
            --mode blocking --json parity-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-enceladus
          path: |
            parity-result.json
            parity-report
            recipes-parity
