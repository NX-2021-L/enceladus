name: Parity Report

# DVP-TSK-840 (DVP-PLN-008 E0): report-only UI parity for enceladus.jreese.net.
# Checks that every default-visible action in the enceladus MCP caps manifest
# is reachable from a ui-v2 route (io-kit parity). Report-only: the job fails
# on invalid input or tool errors, never on counts. Counts are ratcheted
# against frontend/ui-v2/parity/baseline.json (written with all flags on, so
# turning a feature flag on later cannot look like a regression); the report
# itself uses the default flags (all OFF), so flag-gated actions are excluded
# from the effective counts.
#
# Reads AWS only: assumes io-kit-github-read and fetches a 15 minute
# CodeArtifact read token. No deploy, no write. Classified inert in
# tools/prod_gate_baseline.json.
#
# routes.yaml and map.yaml are generated from src/routes/router.tsx and
# src/api/*.ts by frontend/ui-v2/parity/generate_parity.py and committed. The
# job regenerates them and warns when the committed copies were stale.
# Triggers cover both lanes: main (dispatch) and v4/main (gamma).

on:
  pull_request:
    branches: [main, v4/main]
  push:
    branches: [main, v4/main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parity-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Parity (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      PARITY_DIR: frontend/ui-v2/parity
      CAPS: tools/enceladus-mcp-server/parity/caps.json
      STACK: enceladus.jreese.net
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356364570033:role/io-kit-github-read
          aws-region: us-west-2

      - name: Install @io-kit/parity (per-build CodeArtifact read token)
        shell: bash
        run: |
          set -euo pipefail
          T=$(aws codeartifact get-authorization-token --domain io --domain-owner 356364570033 --duration-seconds 900 --query authorizationToken --output text)
          echo "::add-mask::$T"
          E=https://io-356364570033.d.codeartifact.us-west-2.amazonaws.com/npm/io-kit/
          mkdir -p "$RUNNER_TEMP/iokit" && cd "$RUNNER_TEMP/iokit"
          printf '@io-kit:registry=%s\n//%s:_authToken=%s\n' "$E" "${E#https://}" "$T" > .npmrc
          npm init -y >/dev/null && npm install --no-audit --no-fund @io-kit/parity@0.1.0
          echo "$RUNNER_TEMP/iokit/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Generate manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I "$PARITY_DIR/generate_parity.py"
          if ! git diff --quiet -- "$PARITY_DIR"; then
            echo "::warning::committed routes.yaml/map.yaml were stale; run python3 $PARITY_DIR/generate_parity.py and commit the result"
            git diff --stat -- "$PARITY_DIR"
          fi

      - name: Parity (report-only)
        shell: bash
        run: |
          set -euo pipefail
          io-kit parity validate "$CAPS" "$PARITY_DIR/routes.yaml"
          # ratchet: baseline and check both with all flags on, like for like
          io-kit parity baseline check --baseline "$PARITY_DIR/baseline.json" \
            --caps "$CAPS" --routes "$PARITY_DIR/routes.yaml" --stack "$STACK" \
            --mapping "$PARITY_DIR/map.yaml" --flags '*' \
            --mode report-only --json parity-result.json
          # report: default flags (all off), flag-gated actions excluded
          io-kit parity report --caps "$CAPS" --routes "$PARITY_DIR/routes.yaml" \
            --stack "$STACK" --mapping "$PARITY_DIR/map.yaml" \
            --format md --out parity-report
          cat parity-report/*.md >> "$GITHUB_STEP_SUMMARY"
