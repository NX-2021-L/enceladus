name: PR Commit Gate

# ENC-FTR-037: Every PR targeting main must include a commit-complete-id (CCI-xxx)
# issued by the checkout service. This ensures that:
#   1. A tracker task exists and was checked out for the change
#   2. The task was advanced to "committed" status with a validated commit SHA
#   3. The agent received the CCI token from the checkout service
#
# To obtain a CCI, advance the task to committed status via:
#   - MCP: advance_task_status(target_status="committed", transition_evidence={commit_sha: "..."})
#   - API: POST /api/v1/checkout/{project}/task/{task_id}/advance
#
# The CCI must appear anywhere in the PR body in the format: CCI-<32 lowercase hex chars>

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - 'v[0-9]*/main'
  workflow_dispatch:
    # ENC-TSK-Q21 FR-8 (DOC-5368FE6515ED): PRs and pushes made with
    # GITHUB_TOKEN never trigger pull_request workflows, so a promote PR
    # opened by promote-gamma-to-prod-request.yml (itself GITHUB_TOKEN) would
    # never get this required "PR Commit Gate" check run. That workflow
    # dispatches this one directly with the PR number instead, so the check
    # actually executes and reports on the promote commit.
    inputs:
      pr_number:
        description: "PR number to run the gate against"
        type: string
        required: true

jobs:
  commit-gate:
    name: PR Commit Gate
    runs-on: ubuntu-latest

    steps:
      # ENC-TSK-Q21: normalize PR_NUMBER/HEAD_REF/BASE_REF/HEAD_SHA/BODY from
      # whichever trigger fired -- the pull_request event context directly,
      # or (workflow_dispatch) a GitHub API read of inputs.pr_number -- so
      # every step below reads one source regardless of trigger.
      - name: Resolve PR context (event or dispatch)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          EVT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVT_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$DISPATCH_PR_NUMBER" ]]; then
              echo "::error::workflow_dispatch requires input pr_number."
              exit 1
            fi
            PR_NUMBER="$DISPATCH_PR_NUMBER"
            PR_JSON=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}")
            HEAD_REF=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['ref'])")
            BASE_REF=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['base']['ref'])")
            HEAD_SHA=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['sha'])")
            BODY=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body') or '')")
          else
            PR_NUMBER="$EVT_PR_NUMBER"
            HEAD_REF="$EVT_HEAD_REF"
            BASE_REF="$EVT_BASE_REF"
            HEAD_SHA="$EVT_HEAD_SHA"
            BODY="$EVT_BODY"
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "body<<PRBODY_EOF"
            echo "$BODY"
            echo "PRBODY_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER: head=$HEAD_REF base=$BASE_REF head_sha=$HEAD_SHA (event=$EVENT_NAME)"

      # ENC-TSK-G71: sync-main-to-v4main.yml opens transient PRs base=v4/main
      # head=auto/sync-main-to-v4main-* to forward-sync v4/main without bypass
      # actors. These PRs are not task-bound and have no CCI. Recognize the
      # pattern + base and short-circuit the gate as a pass.
      # ENC-TSK-Q21 FR-8: promote-gamma-to-prod-request.yml opens transient
      # PRs base=main head=auto/promote-v4main-to-main-* to promote an
      # already gamma-validated v4/main commit. Same waiver rationale -- no
      # tracker task/CCI for a PR the relay itself opened -- but the promote
      # class additionally asserts the head sha is gamma-validated (below),
      # which the sync class does not need (it never leaves v4/main).
      - name: Classify PR (CCI-exempt classes)
        id: classify
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          # ENC-TSK-Q21 review fix: branch name alone is spoofable -- any
          # same-repo PR author (or, before this fix, even a fork, since
          # head_repo was never checked) can name a branch
          # auto/promote-v4main-to-main-* and point it at any commit that
          # has ever landed on v4/main (trivially an ancestor of the current
          # tip), waiving CCI on a PR the promote relay never opened. Require
          # the head repo to be this repo (never a fork) AND the PR author to
          # be the promote relay's own actor (github-actions[bot], the
          # GITHUB_TOKEN identity promote-gamma-to-prod-request.yml runs as)
          # before granting the waiver.
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # On the pull_request event these come straight from the event
          # context; on workflow_dispatch (promote's own trigger path) the
          # event context has no PR payload, so resolve the same fields via
          # the API for the dispatched pr_number.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_JSON=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}")
            HEAD_REPO_FULL_NAME=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['head']['repo']['full_name'])")
            PR_USER_LOGIN=$(echo "$PR_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['user']['login'])")
          fi

          if [[ "$HEAD_REF" == auto/sync-main-to-v4main-* && "$BASE_REF" == "v4/main" ]]; then
            echo "Auto-sync PR detected (head=$HEAD_REF base=$BASE_REF) — CCI requirement waived."
            echo "auto_sync=true" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_REF" == auto/promote-v4main-to-main-* && "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REPO_FULL_NAME" != "$REPO" ]]; then
              echo "::error::ENC-TSK-Q21 FR-8: promote-pattern PR head=$HEAD_REF is from a fork ($HEAD_REPO_FULL_NAME), not $REPO -- refusing to waive CCI."
              exit 1
            fi
            if [[ "$PR_USER_LOGIN" != "github-actions[bot]" ]]; then
              echo "::error::ENC-TSK-Q21 FR-8: promote-pattern PR head=$HEAD_REF was opened by '$PR_USER_LOGIN', not the promote relay (github-actions[bot]) -- refusing to waive CCI."
              exit 1
            fi
            echo "Promote PR detected (head=$HEAD_REF base=$BASE_REF, opened by $PR_USER_LOGIN from $HEAD_REPO_FULL_NAME) — CCI requirement waived (ancestry asserted separately)."
            echo "auto_sync=false" >> "$GITHUB_OUTPUT"
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto_sync=false" >> "$GITHUB_OUTPUT"
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      # ENC-TSK-Q21 FR-8: the promote class skips ONLY CCI extraction/
      # validation (below) -- every other step, including deploy-target
      # declaration, still runs. This step proves the waiver is safe: the
      # promote PR's head commit must already be part of gamma's validated
      # history, not an arbitrary commit smuggled onto the promote branch.
      - name: Checkout (promote ancestry check only)
        if: steps.classify.outputs.promote == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert promote PR head is ancestor-or-equal of v4/main (ENC-TSK-Q21 FR-8)
        if: steps.classify.outputs.promote == 'true'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin v4/main --quiet
          git fetch origin "$HEAD_SHA" --quiet || true
          if git merge-base --is-ancestor "$HEAD_SHA" origin/v4/main; then
            echo "OK: promote PR head $HEAD_SHA is an ancestor-or-equal of origin/v4/main."
          else
            echo "::error::ENC-TSK-Q21 FR-8: promote PR head $HEAD_SHA is not an ancestor-or-equal of origin/v4/main -- refusing to waive CCI for a non-gamma-validated commit."
            exit 1
          fi

      - name: Extract commit-complete-id from PR body
        id: extract_cci
        if: steps.classify.outputs.auto_sync != 'true' && steps.classify.outputs.promote != 'true'
        env:
          PR_BODY: ${{ steps.pr.outputs.body }}
        run: |
          # Extract CCI token: pattern CCI-{32 lowercase hex chars}
          CCI_ID=$(echo "$PR_BODY" | grep -oE 'CCI-[0-9a-f]{32}' | head -1 || true)

          if [ -z "$CCI_ID" ]; then
            echo "::error::PR requires a commit-complete-id (CCI-xxx) from the checkout service."
            echo "::error::To obtain one: advance the tracker task to 'committed' status with a commit SHA."
            echo "::error::MCP: advance_task_status(target_status='committed', transition_evidence={commit_sha: '<sha>'})"
            echo "::error::The CCI token will be returned in the response. Include it anywhere in this PR body."
            exit 1
          fi

          echo "Found commit-complete-id: $CCI_ID"
          echo "cci_id=$CCI_ID" >> "$GITHUB_OUTPUT"

      - name: Validate commit-complete-id with checkout service
        if: steps.classify.outputs.auto_sync != 'true' && steps.classify.outputs.promote != 'true'
        env:
          CCI_ID: ${{ steps.extract_cci.outputs.cci_id }}
          CHECKOUT_SERVICE_BASE: https://8nkzqkmxqc.execute-api.us-west-2.amazonaws.com/api/v1/checkout
          COORDINATION_INTERNAL_API_KEY: ${{ secrets.COORDINATION_INTERNAL_API_KEY }}
        run: |
          VALIDATE_URL="${CHECKOUT_SERVICE_BASE}/validate/commit-complete/${CCI_ID}"
          echo "Validating: $VALIDATE_URL"

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "X-Coordination-Internal-Key: ${COORDINATION_INTERNAL_API_KEY}" \
            -H "Accept: application/json" \
            "$VALIDATE_URL")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n 1)

          echo "Response (HTTP $HTTP_CODE): $HTTP_BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            VALID=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(d.get('valid',False)).lower())" 2>/dev/null || echo "false")
            if [ "$VALID" = "true" ]; then
              TASK_ID=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('task_id','unknown'))" 2>/dev/null || echo "unknown")
              echo "✅ commit-complete-id is valid. Associated task: $TASK_ID"
              echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
              exit 0
            else
              REASON=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('reason','unknown'))" 2>/dev/null || echo "unknown")
              echo "::error::commit-complete-id $CCI_ID is not valid: $REASON"
              exit 1
            fi
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "::error::commit-complete-id $CCI_ID not recognized by checkout service."
            echo "::error::Ensure you used the CCI token returned from advance_task_status(target_status='committed')."
            exit 1
          else
            echo "::error::Checkout service validation failed (HTTP $HTTP_CODE). Cannot verify commit-complete-id."
            echo "::error::Response: $HTTP_BODY"
            exit 1
          fi

      # ENC-TSK-E57 AC1: Reject PRs with undeclared deploy target
      - name: Validate deploy target declaration
        if: steps.classify.outputs.auto_sync != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          DEPLOY_API_BASE: https://8nkzqkmxqc.execute-api.us-west-2.amazonaws.com/api/v1/deploy
          COORDINATION_INTERNAL_API_KEY: ${{ secrets.COORDINATION_INTERNAL_API_KEY }}
        run: |
          VALIDATE_URL="${DEPLOY_API_BASE}/validate/approval/${PR_NUMBER}"
          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "X-Coordination-Internal-Key: ${COORDINATION_INTERNAL_API_KEY}" \
            -H "Accept: application/json" \
            "$VALIDATE_URL" || echo -e "\n000")
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n 1)

          if [ "$HTTP_CODE" = "200" ]; then
            TARGET=$(echo "$HTTP_BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('original_target',''))" 2>/dev/null || echo "")
            if [ "$TARGET" = "undeclared" ]; then
              echo "::error::Deploy target is 'undeclared'. Add a target:prod or target:gamma label to this PR before merge."
              exit 1
            fi
            echo "Deploy target: ${TARGET:-no DPL record}"
          fi
          # If DPL not found or API error, pass silently (non-deploy PRs have no DPL)

      # ENC-TSK-963: Agent provenance validation for Bedrock-authored PRs
      - name: Validate agent provenance (Bedrock PRs)
        if: startsWith(steps.pr.outputs.head_ref, 'agent/')
        env:
          PR_BODY: ${{ steps.pr.outputs.body }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          echo "Agent-authored PR detected: $HEAD_REF"

          # Check for Bedrock dispatch ID tag in PR body
          DISPATCH_ID=$(echo "$PR_BODY" | grep -oE 'Bedrock-Dispatch-ID:\s*\S+' | head -1 || true)

          if [ -z "$DISPATCH_ID" ]; then
            echo "::warning::Agent PR on branch $HEAD_REF does not contain Bedrock-Dispatch-ID tag."
            echo "::warning::For Bedrock-authored PRs, include 'Bedrock-Dispatch-ID: {dispatch_id}' in the PR body."
            echo "provenance=unverified" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Agent provenance tag found: $DISPATCH_ID"
            echo "provenance=verified" >> "$GITHUB_OUTPUT"
          fi
